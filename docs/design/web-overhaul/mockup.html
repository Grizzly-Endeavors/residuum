<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Residuum Combined</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=JetBrains+Mono:wght@400;500&family=Onest:wght@400;500;600&display=swap">
<style>
/* Layout: a persistent 248px rail (Home, then agents whose places open along a blue vein, then team places; settings gear in the foot)
   | the working column (Home overview, or a conversation capped at 720px) | an optional context panel beside the chat.
   Settings is one large modal with an agent picker. Phone: fixed bottom bar (menu, inbox, home, search, settings); the rail becomes a left drawer. */
:root{
  color-scheme: dark;
  /* stone */
  --stone-0:#0e0e10; --stone-1:#131315; --stone-2:#161618; --stone-3:#1c1c1f; --stone-4:#26262a; --input:#141416;
  --line:#2a2a2e; --line-soft:#222225;
  --text:#e8e8ea; --text-2:#9a9a9f; --text-3:#85858b;
  /* vein */
  --vein:#3b8bdb; --vein-bright:#5aa3f0; --vein-dim:#2a6cb5; --vein-hover:#3175c2;
  --vein-tint:rgba(59,139,219,.14); --vein-faint:rgba(59,139,219,.07); --vein-line:rgba(59,139,219,.35);
  /* moss */
  --moss:#6b7a4a; --moss-text:#8a9e62; --moss-tint:rgba(107,122,74,.2);
  /* error */
  --err:#c0392b; --err-text:#e0675a; --err-tint:rgba(192,57,43,.13);
  --on-accent:#ffffff; --scrim:rgba(6,6,8,.62);
  --shadow-float:0 14px 44px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.35);
  /* type */
  --font-ui:"Onest","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-mono:"JetBrains Mono","SF Mono",Consolas,monospace;
  --font-mark:"Cinzel",Georgia,serif;
  --fs-xs:12px; --fs-sm:13px; --fs-ui:14px; --fs-msg:15px; --fs-h:17px; --fs-title:20px;
  /* shape + motion */
  --r-sm:6px; --r-md:8px; --r-lg:12px;
  --rail-w:248px; --panel-w:440px; --col:720px; --tab-h:60px;
  --t-fast:150ms; --t:200ms; --ease:cubic-bezier(.2,.8,.2,1);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;background:var(--stone-0)}
body{height:100%;margin:0;background:var(--stone-0);color:var(--text);font:400 var(--fs-ui)/1.5 var(--font-ui);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:not-allowed}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--vein-bright);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.i{flex:none;display:block}
.grow{flex:1}
code,.mono{font-family:var(--font-mono);font-size:.86em}
kbd{font:500 11px var(--font-mono);color:var(--text-3);background:var(--stone-3);padding:2px 6px;border-radius:4px}

/* ── app frame ─────────────────────────────────────── */
.app{height:100%;display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr) auto;grid-template-areas:"rail main panel"}
.rail{grid-area:rail}
.main{grid-area:main;min-width:0;min-height:0;display:flex;flex-direction:column;position:relative}
.panel{grid-area:panel}
.mhead,.tabs{display:none}

/* ── rail ──────────────────────────────────────────── */
.rail{background:var(--stone-1);border-right:1px solid var(--line-soft);display:flex;flex-direction:column;min-height:0}
.rail-top{display:flex;align-items:center;padding:16px 18px 12px}
.mark{display:flex;align-items:center;gap:10px;font-family:var(--font-mark);font-weight:500;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--text)}
.mark .i{color:var(--vein)}
.search{display:flex;align-items:center;gap:8px;margin:0 10px 4px;height:34px;padding:0 8px 0 10px;border-radius:var(--r-sm);background:var(--stone-2);color:var(--text-3);font-size:var(--fs-sm);transition:background var(--t-fast),color var(--t-fast)}
.search:hover{background:var(--stone-3);color:var(--text-2)}
.search kbd{margin-left:auto}
.rail-scroll{flex:1;overflow-y:auto;padding:4px 8px 16px}
.rail-label{display:flex;align-items:center;justify-content:space-between;padding:14px 8px 6px;font-size:var(--fs-xs);color:var(--text-3);font-weight:500}
.rail-label button{width:24px;height:24px;border-radius:5px;display:grid;place-items:center;color:var(--text-3)}
.rail-label button:hover{background:var(--stone-3);color:var(--text)}
.rail ul{list-style:none;margin:0;padding:0}
.agent-row,.nav-row{width:100%;display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border-radius:var(--r-sm);color:var(--text-2);transition:background var(--t-fast),color var(--t-fast)}
.agent-row:hover,.nav-row:hover{background:var(--stone-3);color:var(--text)}
.agent-row.is-sel{color:var(--text);font-weight:500}
.nav-row.on{background:var(--vein-tint);color:var(--text)}
.an{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-wrap{width:16px;height:16px;display:grid;place-items:center;flex:none}
.g{width:8px;height:8px;border-radius:50%;display:block}
.g-running{background:var(--moss-text)}
.g-working{background:var(--vein-bright);box-shadow:0 0 0 3px var(--vein-tint);animation:breathe 1.6s ease-in-out infinite}
.g-stopped{border:1.5px solid var(--text-3)}
.g-starting{border:1.5px solid var(--vein-bright);border-right-color:transparent;animation:spin .9s linear infinite}
.g-failed{width:0;height:0;border-radius:0;border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:9px solid var(--err-text)}
@keyframes breathe{50%{box-shadow:0 0 0 5px rgba(59,139,219,.04)}}
@keyframes spin{to{transform:rotate(360deg)}}
.state-word{font-size:var(--fs-xs);color:var(--text-3);font-weight:400}
.state-word.err{color:var(--err-text)}
.state-word.vein{color:var(--vein-bright)}
.count{min-width:18px;height:18px;padding:0 5px;border-radius:9px;display:inline-grid;place-items:center;font:600 11px/1 var(--font-ui);background:var(--vein-tint);color:var(--vein-bright);flex:none}
.count.solid{background:var(--vein-bright);color:var(--stone-0)}
.places{position:relative;padding:2px 0 8px 26px}
.places::before{content:"";position:absolute;left:15.5px;top:0;bottom:14px;width:1px;background:linear-gradient(180deg,var(--vein-dim),rgba(59,139,219,.16))}
.place{width:100%;display:flex;align-items:center;gap:9px;height:30px;padding:0 8px;border-radius:var(--r-sm);color:var(--text-2);position:relative;font-size:var(--fs-sm);transition:background var(--t-fast),color var(--t-fast)}
.place:hover{background:var(--stone-3);color:var(--text)}
.place.on{background:var(--vein-tint);color:var(--text)}
.place.on::before{content:"";position:absolute;left:-10.5px;top:50%;width:8px;height:1px;background:var(--vein-bright);box-shadow:0 0 6px rgba(90,163,240,.5)}
.place .count{margin-left:auto}
.places.working::after{content:"";position:absolute;left:14px;top:0;width:4px;height:26px;border-radius:2px;background:linear-gradient(180deg,transparent,var(--vein-bright),transparent);animation:flow 1.8s var(--ease) infinite;pointer-events:none}
@keyframes flow{0%{transform:translateY(-8px);opacity:0}25%{opacity:1}100%{transform:translateY(150px);opacity:0}}
.rail-foot{padding:10px 12px 14px;border-top:1px solid var(--line-soft);display:flex;align-items:center;gap:8px}
.dir-badge{height:26px;padding:0 10px;border-radius:13px;background:var(--stone-3);color:var(--text-2);font:500 12px var(--font-ui);display:inline-flex;align-items:center;gap:6px;flex:none}
.dir-badge:hover{color:var(--text);background:var(--stone-4)}
.dir-badge b{color:var(--vein-bright);font-weight:600}

/* ── main: top bar ─────────────────────────────────── */
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.topbar{flex:none;display:flex;align-items:center;gap:12px;min-height:52px;padding:8px clamp(16px,3vw,24px);border-bottom:1px solid var(--line-soft)}
.tb-l{display:flex;align-items:baseline;gap:10px;min-width:0;flex-wrap:wrap}
.tb-title{margin:0;font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.tb-sub{color:var(--text-3);font-size:var(--fs-sm)}
.tb-r{margin-left:auto;display:flex;gap:8px;align-items:center}
.pill{height:28px;padding:0 11px;border-radius:14px;display:inline-flex;align-items:center;gap:7px;background:var(--vein-faint);color:var(--vein-bright);font-size:12.5px;font-weight:500;white-space:nowrap}
.pill:hover{background:var(--vein-tint)}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.degraded{flex:none;display:flex;gap:10px;align-items:center;padding:9px clamp(16px,3vw,24px);background:var(--err-tint);color:var(--text);font-size:var(--fs-sm)}
.degraded .i{color:var(--err-text)}

/* ── chat ──────────────────────────────────────────── */
.feed{flex:1;min-height:0;overflow-y:auto}
.feed-inner{max-width:calc(var(--col) + 48px);margin:0 auto;padding:28px 24px 24px;display:flex;flex-direction:column;gap:18px}
.feed-inner.centered{min-height:100%;justify-content:center}
.msg-user{align-self:flex-end;max-width:min(82%,560px);background:var(--moss-tint);padding:9px 14px;border-radius:14px 14px 4px 14px;font-size:var(--fs-msg);line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.msg-agent{display:flex;flex-direction:column;gap:6px;min-width:0}
.prose{font-size:var(--fs-msg);line-height:1.65;color:var(--text);overflow-wrap:anywhere}
.prose p{margin:0 0 10px}
.prose p:last-child{margin-bottom:0}
.prose ul,.prose ol{margin:4px 0 10px;padding-left:22px}
.prose li{margin:3px 0}
.prose li::marker{color:var(--text-3)}
.prose strong{font-weight:600}
.prose h3{margin:14px 0 6px;font-size:15px;font-weight:600}
.prose h3:first-child{margin-top:0}
.prose code{background:var(--stone-3);padding:1px 5px;border-radius:4px;color:var(--text)}
.prose.sm{font-size:14px;line-height:1.6}
.caret{display:inline-block;width:7px;height:15px;margin-left:2px;vertical-align:-2px;background:var(--vein-bright);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.note{color:var(--text-3);font-size:var(--fs-sm)}
.divider{display:flex;align-items:center;gap:12px;color:var(--text-3);font-size:var(--fs-xs);margin:4px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line-soft)}
.divider.new{color:var(--vein-bright)}
.divider.new::before,.divider.new::after{background:var(--vein-line)}
.compressed{display:flex;gap:10px;align-items:flex-start;color:var(--text-2);font-size:var(--fs-sm);padding:10px 12px;border-radius:var(--r-md);background:var(--stone-1)}
.compressed .i{margin-top:2px;color:var(--text-3)}

.act{align-self:flex-start;display:inline-flex;align-items:center;text-align:left;gap:7px;min-height:28px;padding:0 9px 0 6px;margin-left:-6px;border-radius:var(--r-sm);color:var(--text-3);font-size:var(--fs-sm);transition:background var(--t-fast),color var(--t-fast)}
button.act:hover{background:var(--stone-2);color:var(--text-2)}
.act .chev{transition:transform var(--t) var(--ease)}
.act[aria-expanded="true"] .chev{transform:rotate(90deg)}
.act.live{color:var(--text-2);gap:9px;padding-left:8px}
.act.live .pulse{width:8px;height:8px;border-radius:50%;background:var(--vein-bright);animation:breathe 1.4s infinite}
.act .dur{font-variant-numeric:tabular-nums}
.act-stop{height:24px;padding:0 8px;border-radius:5px;background:var(--stone-3);color:var(--text-2);font-size:12px;display:inline-flex;gap:5px;align-items:center;margin-left:4px}
.act-stop:hover{color:var(--text);background:var(--stone-4)}
.steps{list-style:none;margin:0 0 4px 1px;padding:2px 0 2px 10px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:1px}
.step-row{display:flex;align-items:center;gap:8px;min-height:28px;width:100%;padding:3px 6px;border-radius:5px;color:var(--text-2);font-size:var(--fs-sm)}
button.step-row:hover{background:var(--stone-2);color:var(--text)}
button.step-row .i:last-child{color:var(--text-3);transition:transform var(--t) var(--ease)}
button.step-row[aria-expanded="true"] .i:last-child{transform:rotate(180deg)}
.step-row .lbl{flex:1;min-width:0;overflow-wrap:anywhere}
.st-ic{width:16px;height:16px;display:grid;place-items:center;color:var(--text-3);flex:none}
.st-run{color:var(--text)}
.spin{display:block;width:11px;height:11px;border-radius:50%;border:1.5px solid var(--vein-bright);border-right-color:transparent;animation:spin .8s linear infinite}
.st-stopped .st-ic{color:var(--err-text)}
.step-detail{margin:2px 0 6px 30px;padding:9px 11px;border-radius:var(--r-sm);background:var(--stone-2);font:400 12px/1.65 var(--font-mono);color:var(--text-2);white-space:pre-wrap;overflow-wrap:anywhere}
.step-detail .btn{margin-top:8px;font-family:var(--font-ui);white-space:nowrap}

.scard{background:var(--stone-2);border-radius:10px;padding:14px 16px 12px;display:flex;flex-direction:column;gap:8px}
.scard-h{display:flex;align-items:center;gap:8px;font-size:var(--fs-xs);color:var(--text-3)}
.scard-h .i{color:var(--vein-bright)}
.scard-title{margin:0;font-size:14px;font-weight:600}
.scard-f{display:flex;gap:8px;margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);white-space:nowrap}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.chip.working{color:var(--vein-bright)}
.chip.working .dot{animation:breathe 1.6s infinite}
.chip.err{color:var(--err-text)}
.chip.ok{color:var(--moss-text)}
.chip.idle{color:var(--text-3)}

.state{margin:0 auto;max-width:480px;width:100%;padding:24px 8px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.feed-inner:not(.centered) .state{margin-top:8px;background:var(--stone-1);border-radius:var(--r-lg);padding:20px}
.state-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--stone-2);color:var(--text-2)}
.state.failed .state-ic{background:var(--err-tint);color:var(--err-text)}
.state h2{margin:0;font-size:var(--fs-h);font-weight:600}
.state p{margin:0;color:var(--text-2);line-height:1.6}
.state .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.state details{font-size:var(--fs-sm);color:var(--text-3);width:100%}
.state summary{cursor:pointer;padding:4px 0;width:max-content}
.state pre{margin:6px 0 0;padding:10px 12px;border-radius:6px;background:var(--stone-2);font:12px/1.6 var(--font-mono);color:var(--text-2);white-space:pre-wrap;overflow-wrap:anywhere}

.composer-wrap{flex:none;padding:0 24px 18px}
.composer{position:relative;max-width:var(--col);margin:0 auto;background:var(--stone-2);border-radius:var(--r-lg);padding:10px 10px 8px 14px;display:flex;flex-direction:column;gap:6px;box-shadow:inset 0 0 0 1px var(--line-soft);transition:box-shadow var(--t-fast)}
.composer:focus-within{box-shadow:inset 0 0 0 1px rgba(59,139,219,.5),0 0 0 3px var(--vein-faint)}
.composer textarea{width:100%;min-height:24px;max-height:200px;resize:none;border:0;background:transparent;font-size:var(--fs-msg);line-height:1.5;padding:2px 0;outline:none;display:block}
.composer textarea::placeholder{color:var(--text-3)}
.composer.is-off{opacity:.55}
.comp-bar{display:flex;align-items:center;gap:4px;min-width:0}
.icon-btn{width:32px;height:32px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--text-2);flex:none;transition:background var(--t-fast),color var(--t-fast)}
.icon-btn:hover:not(:disabled){background:var(--stone-3);color:var(--text)}
.icon-btn:disabled{opacity:.4}
.model-btn{min-width:0;height:30px;padding:0 6px 0 10px;border-radius:var(--r-sm);display:flex;align-items:center;gap:6px;color:var(--text-2);font-size:12.5px}
.model-btn .ml{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.model-btn:hover:not(:disabled){background:var(--stone-3);color:var(--text)}
.model-btn:disabled{opacity:.5}
.send{margin-left:auto;flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--vein-dim);color:var(--on-accent);transition:background var(--t-fast)}
.send:hover:not(:disabled){background:var(--vein-hover)}
.send:disabled{background:var(--stone-3);color:var(--text-3)}
.send.stop{background:var(--stone-4);color:var(--text)}
.send.stop:hover{background:var(--line)}

/* ── buttons + fields ──────────────────────────────── */
.btn{height:32px;padding:0 12px;border-radius:var(--r-sm);font:500 13px/1 var(--font-ui);display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;cursor:pointer;transition:background var(--t-fast),color var(--t-fast);white-space:nowrap}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn.primary{background:var(--vein-dim);color:var(--on-accent)}
.btn.primary:hover:not(:disabled){background:var(--vein-hover)}
.btn.quiet{background:var(--stone-3);color:var(--text)}
.btn.quiet:hover:not(:disabled){background:var(--stone-4)}
.btn.ghost{background:transparent;color:var(--text-2)}
.btn.ghost:hover:not(:disabled){background:var(--stone-3);color:var(--text)}
.btn.danger{background:transparent;color:var(--err-text)}
.btn.danger:hover:not(:disabled){background:var(--err-tint)}
.btn:disabled{opacity:.4}
.btn:active:not(:disabled){transform:translateY(1px)}
.link{color:var(--vein-bright);text-decoration:underline;text-underline-offset:2px;text-decoration-color:var(--vein-line)}
.link:hover{text-decoration-color:currentColor}

/* ── pages ─────────────────────────────────────────── */
.page{flex:1;min-height:0;overflow-y:auto}
.page-inner{max-width:880px;padding:24px clamp(16px,3vw,32px) 64px}
.sec{margin-bottom:32px}
.sec-h{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:var(--fs-sm);font-weight:600;color:var(--text-2)}
.sec-note{color:var(--text-3);font-size:var(--fs-sm);margin:-4px 0 12px}
.empty-line{color:var(--text-3);font-size:var(--fs-sm);padding:10px 12px;margin:0}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.row{display:flex;align-items:center;gap:6px;border-radius:var(--r-md);transition:background var(--t-fast)}
.row:hover{background:var(--stone-1)}
.row-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:10px 12px}
.row-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--stone-2);color:var(--text-2);flex:none}
.row.warn .row-ic{background:var(--err-tint);color:var(--err-text)}
.row.bad .row-ic{color:var(--err-text)}
.row-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-title{color:var(--text);overflow-wrap:anywhere}
.row-sub{color:var(--text-3);font-size:var(--fs-sm);display:flex;gap:4px 12px;flex-wrap:wrap}
.row-sub .err{color:var(--err-text)}
.row-sub .ok{color:var(--moss-text)}
.row-status{flex:none;text-align:right}
.row-actions{display:flex;gap:4px;padding-right:8px;flex:none}

.tree{list-style:none;margin:0;padding:0;font-size:var(--fs-sm)}
.tree ul{list-style:none;margin:0;padding:0 0 0 18px}
.tree-row{width:100%;display:flex;align-items:center;gap:8px;min-height:32px;padding:0 10px;border-radius:var(--r-sm);color:var(--text-2)}
button.tree-row:hover{background:var(--stone-2);color:var(--text)}
.tree-row.on{background:var(--vein-tint);color:var(--text)}
.tree-row .meta{margin-left:auto;color:var(--text-3);font-size:12px;white-space:nowrap}
.tree-row .path{font-family:var(--font-mono);font-size:12.5px;overflow-wrap:anywhere}
.tree-row.dir{color:var(--text)}

.agents{display:flex;flex-direction:column;gap:8px;margin-bottom:36px}
.agent-card{background:var(--stone-1);border-radius:var(--r-lg);padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center}
.ac-name{display:flex;align-items:center;gap:8px;font-weight:600}
.ac-name .state-word{font-weight:400}
.ac-desc{color:var(--text-2);font-size:var(--fs-sm);margin-top:2px}
.ac-err{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--err-text);font-size:var(--fs-sm);padding-top:10px;border-top:1px solid var(--line-soft)}
.ac-ctrl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.auto{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-2);margin-right:6px}

.tabs-inline{display:flex;gap:4px;margin-bottom:14px}
.tab-i{height:30px;padding:0 12px;border-radius:15px;color:var(--text-2);font-size:var(--fs-sm)}
.tab-i:hover{color:var(--text)}
.tab-i[aria-selected="true"]{background:var(--stone-3);color:var(--text)}
.inbox-item.unread .row-title{font-weight:600}
.unread-dot{width:7px;height:7px;border-radius:50%;background:var(--vein-bright);flex:none}
.inbox-body{padding:0 16px 14px 54px;color:var(--text-2);font-size:14px;line-height:1.6;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.inbox-body .acts{display:flex;gap:6px;flex-wrap:wrap}

/* ── settings ──────────────────────────────────────── */
.settings{flex:1;min-height:0;display:grid;grid-template-columns:220px minmax(0,1fr)}
.set-nav{border-right:1px solid var(--line-soft);padding:14px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.set-nav .grp{font-size:var(--fs-xs);color:var(--text-3);padding:16px 10px 6px;font-weight:500}
.set-link{height:32px;padding:0 10px;border-radius:var(--r-sm);display:flex;align-items:center;color:var(--text-2);font-size:var(--fs-sm);flex:none}
.set-link:hover{background:var(--stone-3);color:var(--text)}
.set-link.on{background:var(--vein-tint);color:var(--text)}
.set-foot{margin-top:auto;padding:16px 10px 4px;font-size:12px;color:var(--text-3);line-height:1.55}
.set-body{overflow-y:auto;padding:24px clamp(16px,3vw,36px) 96px;min-width:0}
.set-body h2{margin:0 0 4px;font-size:var(--fs-title);font-weight:600;letter-spacing:-.01em}
.set-lede{margin:0 0 22px;color:var(--text-2);max-width:640px}
.group{background:var(--stone-1);border-radius:var(--r-lg);padding:18px 18px 20px;margin-bottom:16px;max-width:640px;display:flex;flex-direction:column;gap:16px}
.group-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.group-h h3{margin:0;font-size:15px;font-weight:600}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.flabel{font-size:var(--fs-sm);font-weight:500;color:var(--text)}
.help{font-size:12.5px;color:var(--text-3);line-height:1.5;margin:0}
.fields-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.inp{height:36px;padding:0 11px;font-size:14px;border-radius:var(--r-sm);background:var(--input);border:1px solid var(--line);color:var(--text);width:100%;transition:border-color var(--t-fast),box-shadow var(--t-fast)}
textarea.inp{height:auto;padding:9px 11px;resize:vertical;line-height:1.5}
.inp::placeholder{color:var(--text-3)}
.inp:focus{outline:none;border-color:var(--vein);box-shadow:0 0 0 3px var(--vein-faint)}
.inp.err{border-color:var(--err)}
.sel{position:relative}
.sel select{appearance:none;-webkit-appearance:none;padding-right:32px;cursor:pointer}
.sel::after{content:"";position:absolute;right:13px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--text-2);border-bottom:1.5px solid var(--text-2);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.err-line{display:flex;gap:6px;align-items:flex-start;color:var(--err-text);font-size:12.5px;line-height:1.45}
.err-line .i{margin-top:1px}
.seg{display:inline-flex;background:var(--stone-3);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap;align-self:flex-start}
.seg button{height:28px;padding:0 12px;border-radius:6px;color:var(--text-2);font-size:var(--fs-sm)}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--stone-0);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.4)}
.switch-row{display:flex;gap:16px;align-items:flex-start;justify-content:space-between}
.switch{flex:none;width:36px;height:20px;border-radius:10px;background:var(--stone-4);position:relative;transition:background var(--t)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--text-2);transition:transform var(--t) var(--ease),background var(--t)}
.switch[aria-checked="true"]{background:var(--vein-dim)}
.switch[aria-checked="true"]::after{transform:translateX(16px);background:var(--on-accent)}
.conn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-3)}
.conn.on{color:var(--moss-text)}
.conn .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.saved-token{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:var(--fs-sm);color:var(--text-2)}
details.adv{max-width:640px;margin-bottom:16px}
details.adv>summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;min-height:36px;color:var(--text-2);font-size:var(--fs-sm);font-weight:500;border-radius:var(--r-sm);padding:0 8px 0 4px}
details.adv>summary:hover{color:var(--text)}
details.adv>summary::-webkit-details-marker{display:none}
details.adv>summary .i{transition:transform var(--t) var(--ease)}
details.adv[open]>summary .i{transform:rotate(90deg)}
details.adv .group{margin-top:8px}
.ov-row{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:8px 16px;align-items:center}
.ov-row+.ov-row{padding-top:14px;border-top:1px solid var(--line-soft)}
.savebar{position:sticky;bottom:16px;max-width:640px;margin-top:8px;display:flex;align-items:center;gap:8px;padding:8px 8px 8px 16px;background:var(--stone-3);border-radius:var(--r-lg);box-shadow:var(--shadow-float);font-size:var(--fs-sm);animation:pop var(--t) var(--ease)}
.savebar .grow{color:var(--text-2)}
.inline-banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px 10px 14px;border-radius:var(--r-md);background:var(--vein-faint);color:var(--text);max-width:640px;margin-bottom:16px;font-size:var(--fs-sm)}
.inline-banner.bad{background:var(--err-tint)}
.inline-banner .grow{min-width:200px}
.placeholder{max-width:560px;color:var(--text-2);background:var(--stone-1);border-radius:var(--r-lg);padding:18px 20px;line-height:1.6;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.placeholder b{color:var(--text);font-weight:500}
.raw{max-width:640px;margin:0;padding:14px 16px;border-radius:var(--r-lg);background:var(--stone-1);font:12.5px/1.7 var(--font-mono);color:var(--text-2);white-space:pre;overflow-x:auto}
.keyrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.keyrow+.keyrow{padding-top:12px;border-top:1px solid var(--line-soft)}
.keyrow .kt{flex:1;min-width:180px;display:flex;flex-direction:column;gap:2px}
.keyrow .kt span{color:var(--text-3);font-size:12.5px}

/* ── context panel ─────────────────────────────────── */
.panel{width:var(--panel-w);background:var(--stone-1);border-left:1px solid var(--line-soft);display:flex;flex-direction:column;min-height:0;position:relative;min-width:0;animation:slidein var(--t) var(--ease)}
@keyframes slidein{from{opacity:0;transform:translateX(12px)}}
.grip{position:absolute;left:-4px;top:0;bottom:0;width:8px;cursor:col-resize;z-index:2;touch-action:none}
.grip::after{content:"";position:absolute;left:3.5px;top:0;bottom:0;width:1px;background:transparent;transition:background var(--t-fast)}
.grip:hover::after,.grip.drag::after{background:var(--vein)}
.panel-head{flex:none;display:flex;align-items:flex-start;gap:8px;padding:12px 10px 12px 18px;border-bottom:1px solid var(--line-soft)}
.ph-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;padding-top:4px}
.ph-kind{font-size:var(--fs-xs);color:var(--text-3);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ph-kind .i{color:var(--vein-bright)}
.ph-title{margin:0;font-size:15px;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.ph-meta{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:12.5px;color:var(--text-3)}
.ph-actions{display:flex;gap:4px;flex:none;align-items:center}
.panel-body{flex:1;min-height:0;overflow-y:auto;padding:18px 18px 24px;display:flex;flex-direction:column;gap:14px}
.panel-foot{flex:none;padding:10px 12px 12px}
.panel-foot .composer{padding:8px 8px 8px 12px}
.panel-foot .composer textarea{font-size:14px}
.panel-back{display:none}
.tr-brief{background:var(--stone-2);border-radius:var(--r-md);padding:10px 12px;font-size:14px;line-height:1.6}
.tr-from{font-size:var(--fs-xs);color:var(--text-3);margin-bottom:4px;display:block}
.tr-you{align-self:flex-end;max-width:88%;background:var(--moss-tint);border-radius:12px 12px 4px 12px;padding:8px 12px;font-size:14px}
.tr-note{border-left:2px solid var(--moss);padding:2px 0 2px 12px;font-size:14px;color:var(--text-2);line-height:1.55}
.tr-event{font-size:12.5px;color:var(--text-3);display:flex;gap:8px;align-items:center}
.tr-warn{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--r-md);background:var(--err-tint);font-size:14px;line-height:1.55}
.tr-warn .i{color:var(--err-text);margin-top:3px}
.tr-person{font-size:14px;line-height:1.6}
.tr-person b{font-weight:600;margin-right:8px}
.tr-person time{color:var(--text-3);font-size:12px}
.tr-working{display:flex;align-items:center;gap:9px;color:var(--text-2);font-size:var(--fs-sm)}
.tr-working .pulse{width:8px;height:8px;border-radius:50%;background:var(--vein-bright);animation:breathe 1.4s infinite;flex:none}
.doc-meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--text-3)}

.budget{display:flex;flex-direction:column;gap:14px}
.bar{position:relative;height:14px;border-radius:7px;background:var(--stone-3);display:flex;overflow:visible}
.bar span{height:100%}
.bar span:first-child{border-radius:7px 0 0 7px}
.bar .mk{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--text-2);border-radius:1px}
.axis{position:relative;height:16px;font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.axis span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.axis span:first-child{transform:none}
.axis span:last-child{transform:translateX(-100%)}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:var(--fs-sm)}
.legend li{display:flex;align-items:center;gap:10px}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:none}
.legend .v{margin-left:auto;color:var(--text-2);font-variant-numeric:tabular-nums}

.tip{display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:var(--r-lg);background:var(--stone-2)}
.tip .fields-2{grid-template-columns:1fr 1fr}
.tip-out{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.tip-out span{display:block;font-size:var(--fs-sm);color:var(--text-2);font-weight:400}

/* ── overlays ──────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;animation:fade var(--t) var(--ease)}
.catch{position:fixed;inset:0;z-index:50}
@keyframes fade{from{opacity:0}}
.palette{position:fixed;left:50%;top:12vh;transform:translateX(-50%);width:min(620px,calc(100vw - 32px));max-height:min(540px,72vh);display:flex;flex-direction:column;background:var(--stone-3);border-radius:14px;box-shadow:var(--shadow-float);z-index:51;overflow:hidden;animation:rise var(--t) var(--ease)}
@keyframes rise{from{opacity:0;transform:translate(-50%,6px)}}
.pal-in{display:flex;align-items:center;gap:10px;padding:0 14px 0 16px;height:52px;border-bottom:1px solid var(--line);color:var(--text-3)}
.pal-in input{flex:1;min-width:0;height:100%;border:0;background:transparent;font-size:15px;outline:none;color:var(--text)}
.pal-in input::placeholder{color:var(--text-3)}
.pal-list{overflow-y:auto;padding:6px}
.pal-grp{font-size:var(--fs-xs);color:var(--text-3);padding:10px 10px 4px}
.pal-item{width:100%;display:flex;align-items:center;gap:10px;min-height:36px;padding:0 10px;border-radius:8px;color:var(--text-2);font-size:var(--fs-sm)}
.pal-item .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-item .hint{margin-left:auto;color:var(--text-3);font-size:12px;white-space:nowrap;padding-left:10px}
.pal-item.on{background:var(--vein-tint);color:var(--text)}
.pal-empty{padding:18px;color:var(--text-3);font-size:var(--fs-sm)}
.pal-foot{padding:8px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--text-3);display:flex;gap:16px;flex-wrap:wrap}
.pop{position:fixed;z-index:51;width:300px;max-width:calc(100vw - 24px);background:var(--stone-3);border-radius:12px;box-shadow:var(--shadow-float);padding:8px;animation:pop var(--t) var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(4px)}}
.pop-sec{padding:4px 4px 10px;display:flex;flex-direction:column}
.pop-label{font-size:var(--fs-xs);color:var(--text-3);padding:4px 6px 6px}
.opt{width:100%;display:flex;align-items:center;gap:10px;min-height:34px;padding:0 8px;border-radius:7px;font-size:var(--fs-sm);color:var(--text-2)}
.opt:hover{background:var(--stone-4);color:var(--text)}
.opt[aria-checked="true"]{color:var(--text)}
.opt .ck{margin-left:auto;color:var(--vein-bright);visibility:hidden}
.opt[aria-checked="true"] .ck{visibility:visible}
.opt .sub{color:var(--text-3);font-size:12px}
.pop-note{margin:2px 6px 6px;font-size:12px;color:var(--text-3);line-height:1.5}
.pop.dir{width:360px;padding:16px 18px}
.dir h2{margin:0 0 4px;font-size:15px;font-weight:600;display:flex;gap:8px;align-items:center}
.dir h2 b{color:var(--vein-bright)}
.dir p{margin:0 0 10px;color:var(--text-2);font-size:var(--fs-sm);line-height:1.55}
.dir ul{margin:0 0 12px;padding-left:18px;color:var(--text);font-size:var(--fs-sm);line-height:1.55;display:flex;flex-direction:column;gap:6px}
.dir li::marker{color:var(--vein-bright)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--stone-3);border-radius:16px 16px 0 0;box-shadow:var(--shadow-float);padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:84vh;overflow-y:auto;animation:sheetup var(--t) var(--ease)}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--stone-4);margin:4px auto 12px}
.sheet h2{margin:0 0 10px;font-size:15px;font-weight:600}
.sheet.dir{width:auto;padding-top:8px}
@keyframes sheetup{from{transform:translateY(24px);opacity:0}}
.ag-opt{width:100%;display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 8px;border-radius:10px;text-align:left}
.ag-opt:hover,.ag-opt.on{background:var(--stone-4)}
.ag-opt .t{flex:1;min-width:0;display:flex;flex-direction:column}
.ag-opt .t b{font-weight:600}
.ag-opt .t span{color:var(--text-3);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(460px,calc(100vw - 32px))}
.toast{pointer-events:auto;background:var(--stone-4);color:var(--text);border-radius:10px;padding:10px 14px;font-size:var(--fs-sm);box-shadow:var(--shadow-float);animation:pop var(--t) var(--ease);line-height:1.45}

/* ── rail additions ────────────────────────────────── */
.rail-top{justify-content:space-between;padding-right:10px}
.rail-close{display:none}
.rail-home{margin-top:8px}
.rail-foot{justify-content:space-between}
.gear{width:32px;height:32px}
.gear[aria-pressed="true"]{background:var(--vein-tint);color:var(--text)}
.drawer-scrim{display:none}
.tb-badge{display:none}
.tb-icon{width:30px;height:30px}

/* ── home ──────────────────────────────────────────── */
.tally{display:inline-flex;gap:14px;flex-wrap:wrap;font-size:var(--fs-sm)}
.tally>span{display:inline-flex;align-items:center;gap:6px}
.tally .t-run{color:var(--moss-text)}
.tally .t-stop{color:var(--text-3)}
.tally .t-fail{color:var(--err-text)}
.m-tally{display:none}
.home{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:40px;width:100%;max-width:1200px;margin-inline:auto;padding:24px clamp(16px,3vw,32px) 64px;align-items:start}
.sec-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 10px}
.sec-row .sec-h{margin:0}
.home-main{min-width:0}
.home-aside .sec{margin-bottom:28px}
.needs{display:flex;flex-direction:column;gap:6px}
.need{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px 12px 12px;background:var(--stone-1);border-radius:var(--r-md)}
.need[data-sev="error"] .row-ic,.need[data-sev="warn"] .row-ic{background:var(--err-tint);color:var(--err-text)}
.need[data-sev="info"] .row-ic{background:var(--vein-tint);color:var(--vein-bright)}
.need-text{min-width:0}
.need-title{font-weight:500}
.need-meta{margin-left:8px;color:var(--text-3);font-size:12px;font-weight:400;font-variant-numeric:tabular-nums}
.need-detail{color:var(--text-2);font-size:var(--fs-sm);margin-top:1px}
.need-acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.allclear{margin:0;padding:12px 14px;background:var(--stone-1);border-radius:var(--r-md);color:var(--text-2)}
.board{display:flex;flex-direction:column;gap:2px}
.brow{display:grid;grid-template-columns:minmax(0,1fr) 36px;align-items:center;gap:2px;border-radius:var(--r-md);transition:background var(--t-fast);padding-right:4px}
.brow:hover{background:var(--stone-1)}
.bl{display:grid;grid-template-columns:minmax(150px,1.1fr) 118px minmax(0,2fr) 60px minmax(120px,1fr);gap:16px;align-items:center;padding:10px 12px;border-radius:var(--r-md);cursor:pointer;min-width:0}
.bhead:hover{background:none}
.bhead .bl{cursor:default;padding-block:4px 6px;font-size:12px;color:var(--text-3)}
.bcol-name{min-width:0}
.bname{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.bdesc,.bnow .now,.bnow .last{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bdesc{font-size:12.5px;color:var(--text-3);margin-top:1px}
.bnow{min-width:0}
.bnow .last{font-size:12.5px;color:var(--text-3);margin-top:1px}
.bnow .last .tm,.bmeta .tm{font-variant-numeric:tabular-nums;margin-right:6px}
.bstate{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-sm);color:var(--text-2);white-space:nowrap}
.bstate.s-running{color:var(--moss-text)}
.bstate.s-working,.bstate.s-starting{color:var(--vein-bright)}
.bstate.s-failed{color:var(--err-text)}
.bstate.s-stopped{color:var(--text-3)}
.bnum{text-align:right;font-variant-numeric:tabular-nums;color:var(--text-2)}
.bnext{font-size:var(--fs-sm);color:var(--text-2);line-height:1.35;min-width:0}
.bnext .when{display:block;font-size:12px;color:var(--text-3)}
.bmeta{display:none}
.err{color:var(--err-text)}
.stream{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.stream li{display:grid;grid-template-columns:44px 16px minmax(0,1fr);gap:8px;align-items:start;padding:6px 0;font-size:var(--fs-sm);line-height:1.45}
.stream .tm{color:var(--text-3);text-align:right;font-variant-numeric:tabular-nums;font-size:12px;padding-top:1px}
.stream .g-wrap{margin-top:2px}
.stream .tx{color:var(--text-2)}
.stream .tx b{color:var(--text);font-weight:500}
.stream li.bad .tx{color:var(--err-text)}
.coming{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.coming li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:8px 0;font-size:var(--fs-sm)}

/* ── routing ───────────────────────────────────────── */
function parse(h){
  h = (h || '').replace(/^#/, '');
  if (!h || h === 'home' || h === 'team') return {kind:'home'};
  const globals = {workbench:'workbench', 'shared-files':'shared', inbox:'inbox'};
  if (globals[h]) return {kind:'global', page:globals[h]};
  if (h === 'team-settings' || h.indexOf('team-settings-') === 0) return {kind:'settings', scope:'all', section:h.slice(14) || null};
  if (h === 'settings') return {kind:'settings', scope:null, section:null};
  if (h.indexOf('settings-') === 0) {
    const rest = h.slice(9);
    if (rest === 'all' || AGENTS[rest]) return {kind:'settings', scope:rest, section:null};
    const i = rest.lastIndexOf('-');
    if (i > 0) { const sc = rest.slice(0, i); if (sc === 'all' || AGENTS[sc]) return {kind:'settings', scope:sc, section:rest.slice(i + 1)}; }
    return {kind:'settings', scope:null, section:null};
  }
  let m = h.match(/^([a-z0-9-]+?)-settings(?:-([a-z0-9]+))?$/);
  if (m && AGENTS[m[1]]) return {kind:'settings', scope:m[1], section:m[2] || null};
  m = h.match(/^([a-z0-9-]+?)-(chat|activity|schedule|files)$/);
  if (m && AGENTS[m[1]]) return {kind:'agent', agent:m[1], view:m[2]};
  return {kind:'home'};
}
function go(h){ if ('#' + h === location.hash) route(); else location.hash = h; }
function ctxScope(){ return S.route.kind === 'agent' ? S.route.agent : 'all'; }
function route(){
  const r = parse(location.hash);
  const wasSettings = !!S.settings;
  if (r.kind === 'settings') {
    if (!r.scope) r.scope = ctxScope();
    S.settings = r;
  } else {
    if (r.kind === 'agent' && !(S.route.kind === 'agent' && S.route.agent === r.agent)) S.openAgent = r.agent;
    S.settings = null; S.route = r;
    S.baseHash = (location.hash || '#home').slice(1) || 'home';
    if (r.kind === 'agent') S.lastAgent = r.agent;
  }
  S.layer = null; renderLayer();
  S.drawer = false; applyDrawer();
  renderRail(); renderTabs();
  if (JSON.stringify(S.route) !== S.mainKey) { S.pinned = true; renderMain(); }
  renderPanel(); renderSettings();
  if (wasSettings && !S.settings && S.settingsFrom && document.body.contains(S.settingsFrom)) { S.settingsFrom.focus(); S.settingsFrom = null; }
  const rr = S.route;
  if (!S.settings && rr.kind === 'agent' && rr.view === 'chat' && AGENTS[rr.agent].unread) {
    setTimeout(() => { AGENTS[rr.agent].unread = 0; renderRail(); renderTabs(); }, 600);
  }
}
window.addEventListener('hashchange', route);
function openSettings(scope, section){
  if (!S.settings) S.settingsFrom = document.activeElement;

  go(section ? `settings-${sc}-${section}` : `settings-${sc}`);
}

  const right = (n ? `<button class="pill" data-go="${id}-activity"><span class="dot"></span>${n} running</button>` : '') + `<button class="icon-btn tb-icon" data-a="open-settings" data-scope="${id}" aria-label="${esc(id)} settings" title="${esc(id)} settings">${ic('gear', 16)}</button>`;
  const f = feed(id);
  return `<div class="view">${topbar(glyph(id) + esc(id), esc(a.desc), right)}
    <div class="feed" id="feed"><div class="feed-inner${f.centered ? ' centered' : ''}" id="feed-inner">${f.html}</div></div>
    ${composerHTML(id)}</div>`;
}
function feed(id){
  const st = status(id), msgs = CHATS[id] || [];
  let html = msgs.map(m => msgHTML(id, m)).join('');
  const liveHere = S.live && S.live.agent === id;
  if (liveHere) html += liveHTML();
  let card = '';
  if (st === 'failed') card = failedCard(id);
  else if (st === 'stopped') card = stoppedCard(id);
  else if (st === 'starting') card = `<div class="state" role="status"><div class="state-ic"><span class="spin"></span></div><h2>Starting ${esc(id)}</h2><p>This usually takes a few seconds.</p></div>`;
  else if (!msgs.length && !liveHere) card = `<div class="state"><div class="state-ic">${ic('chat', 18)}</div><h2>No messages yet</h2><p>Tell ${esc(id)} what you need. It will ask about anything it's missing.</p></div>`;
  return {html:html + card, centered:!msgs.length && !liveHere};
}
function msgHTML(id, m){
  switch (m.t) {
    case 'divider': return `<div class="divider" role="separator">${esc(m.label)}</div>`;
    case 'newdiv': return `<div class="divider new" role="separator">${esc(m.label)}</div>`;
    case 'compressed': return `<div class="compressed">${ic('layers', 15)}<span>Older messages are summarized. ${esc(id)} remembers what was said, not the exact wording.</span></div>`;
    case 'user': return `<div class="msg-user">${esc(m.text)}</div>`;
    case 'agent': return `<div class="msg-agent">${m.act ? actHTML(m) : ''}<div class="prose">${m.html}</div></div>`;
    case 'session': return sessionCard(m.id);
  }
  return '';
}
function actHTML(m){
  const open = !!S.open[m.id];
  const steps = open ? `<ol class="steps">${m.act.steps.map((s, i) => stepHTML(m.id, s, i)).join('')}</ol>` : '';
  return `<button class="act" data-a="toggle-act" data-id="${m.id}" aria-expanded="${open}">${ic('chevr', 14, 'chev')}<span>${esc(m.act.summary)} <span class="dur">· ${esc(m.act.dur)}</span></span></button>${steps}`;
}
function stepHTML(mid, s, i){
  const key = `${mid}-${i}`, open = !!S.open[key];
  const icon = s.state === 'stopped' ? ic('x', 14) : ic(s.ic, 14);
  return `<li><button class="step-row st-${s.state || 'done'}" data-a="toggle-step" data-id="${key}" aria-expanded="${open}"><span class="st-ic">${icon}</span><span class="lbl">${esc(s.label)}</span>${ic('chevd', 14)}</button>${open ? `<div class="step-detail">${esc(s.detail)}${s.session ? `<div><button class="btn quiet sm" data-a="panel" data-type="session" data-id="${s.session}">Open session</button></div>` : ''}</div>` : ''}</li>`;
}
function sessionCard(sid){
  const s = SESSIONS[sid];
  return `<article class="scard"><div class="scard-h">${ic(s.ic, 14)}<span>${esc(s.kind)}</span><span class="grow"></span>${chip(s)}</div><h3 class="scard-title">${esc(s.title)}</h3><div class="prose sm">${s.report}</div><div class="scard-f"><button class="btn quiet sm" data-a="panel" data-type="session" data-id="${sid}">Open session</button></div></article>`;
}
function failedCard(id){
  const a = AGENTS[id], P = PROVIDERS[a.provider].label;
  return `<div class="state failed" role="status"><div class="state-ic">${ic('alert', 18)}</div>
    <h2>${esc(id)} couldn't start</h2>
    <p>It's set to use the model “${esc(a.model)}”, which ${esc(P)} doesn't offer. Pick a model ${esc(P)} offers, then restart ${esc(id)}.</p>

    <details><summary>Details for troubleshooting</summary><pre>providers.toml: model '${esc(a.model)}' is not offered by provider '${esc(a.provider)}'
last attempt: ${esc(a.tried)}</pre></details></div>`;
}
function stoppedCard(id){
  return `<div class="state" role="status"><div class="state-ic">${ic('pause', 18)}</div>
    <h2>${esc(id)} is stopped</h2>
    <p>Start it to send messages. Its regular checks don't run while it's stopped.</p>
    <div class="actions"><button class="btn primary" data-a="start" data-agent="${id}">${ic('play', 14)}Start ${esc(id)}</button><button class="btn ghost" data-go="home">Go to Home</button></div></div>`;
}
function composerHTML(id){

    <label class="sr" for="msg">Message ${esc(id)}</label>
    <textarea id="msg" rows="1" placeholder="${off ? `${esc(id)} isn't running` : `Message ${esc(id)}`}"${off ? ' disabled' : ''}>${esc(S.drafts[id] || '')}</textarea>

}
function compBarHTML(id){
  const a = AGENTS[id], off = a.state !== 'running', live = S.live && S.live.agent === id;
  const label = `${modelShort(a)}, ${thinkLabel(a.thinking)}`;

    <button type="button" class="model-btn" data-a="model-pop" aria-haspopup="dialog" aria-label="Model: ${esc(label)}"${off ? ' disabled' : ''}><span class="ml">${esc(label)}</span>${ic('chevd', 14)}</button>
    ${live ? `<button type="button" class="send stop" data-a="stop" aria-label="Stop the reply">${ic('stop', 16)}</button>` : `<button type="submit" class="send" aria-label="Send"${off ? ' disabled' : ''}>${ic('send', 17)}</button>`}`;

function renderFeed(){
  const id = S.route.kind === 'agent' && S.route.view === 'chat' ? S.route.agent : null;
  const fi = $('#feed-inner'); if (!fi || !id) return;
  const f = feed(id); fi.innerHTML = f.html; fi.classList.toggle('centered', f.centered); stick();
}
function renderCompBar(){
  const id = S.route.kind === 'agent' && S.route.view === 'chat' ? S.route.agent : null;
  const cb = $('#comp-bar'); if (cb && id) cb.innerHTML = compBarHTML(id);
}
function stick(force){
  const f = $('#feed'); if (!f) return;
  if (force || S.pinned) f.scrollTop = f.scrollHeight;
}
function autosize(ta){ ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 200) + 'px'; }

/* ── live turn ─────────────────────────────────────── */
const ATLAS_SCRIPT = {
  steps:[
    {ic:'search', live:'Searching memory', done:'Searched memory for “fallback”', detail:'2 notes found\n• Research session: cascade first, then park in the inbox\n• “I would rather not lose anything” (Sep 20)', at:400, end:1700},
    {ic:'file', live:'Reading team/wiki/notification-fallbacks.md', done:'Read team/wiki/notification-fallbacks.md', detail:'38 lines. Retry with backoff, cascade, park in the inbox.', at:1800, end:3300},
    {ic:'layers', live:'Starting a research session', done:'Started a research session', detail:'“Check how long Discord and Telegram outages usually last.”\nIt runs in the background and reports back here.', session:'research2', at:3400, end:4200, onDone:addResearch2}
  ],
  replyAt:4500,
  reply:"I've added a Fallbacks section to team/wiki/notification-routing.md. When a channel fails, urgent notifications move to the next channel within a minute. If every channel is down, they wait in your inbox and I'll mention them the next time you're here.\n\nI also started a research session to check how long Discord and Telegram outages usually last, so the retry windows aren't guesses.",
  html:"<p>I've added a Fallbacks section to <code>team/wiki/notification-routing.md</code>. When a channel fails, urgent notifications move to the next channel within a minute. If every channel is down, they wait in your inbox and I'll mention them the next time you're here.</p><p>I also started a research session to check how long Discord and Telegram outages usually last, so the retry windows aren't guesses.</p>",
  summary:'Searched memory, read 1 file, started a research session'
};
function genericScript(id){
  const file = id === 'scout' ? 'team/wiki/svelte-5-4.md' : 'team/wiki/notification-routing.md';
  const reply = id === 'scout'
    ? "Noted. I'll add that to what I watch for and tell you here when the next release touches it."
    : "Noted. I'll fold that into the routing doc and tell you when the fallback section is ready for a read-through.";
  return {
    steps:[
      {ic:'search', live:'Searching memory', done:'Searched memory', detail:'3 related notes found.', at:400, end:1500},
      {ic:'file', live:`Reading ${file}`, done:`Read ${file}`, detail:'Checked the current version of the page.', at:1600, end:2600}
    ],
    replyAt:2900, reply, html:`<p>${esc(reply)}</p>`, summary:'Searched memory, read 1 file'
  };
}
function addResearch2(){
  if (SESSIONS.research2) return;
  SESSIONS.research2 = {agent:'atlas', kind:'Research session', ic:'layers', title:'Check how long Discord and Telegram outages usually last', who:'Started by atlas', age:'just now', status:'working', talk:true, tr:[
    {k:'brief', from:'Brief from atlas', text:'Check how long Discord and Telegram outages usually last, so the retry windows in the routing doc are based on real numbers.'},
    {k:'working', text:'Working'}]};
  RUNNING.atlas.unshift('research2');
  renderRail(); renderTabs();
  if (S.route.kind === 'agent' && S.route.view === 'activity') renderMain();
  const pill = $('.tb-r .pill'); if (pill) pill.innerHTML = `<span class="dot"></span>${runningCount('atlas')} running`;
}
function send(id){
  const ta = $('#msg'); if (!ta) return;
  const text = ta.value.trim(); if (!text || S.live || AGENTS[id].state !== 'running') return;
  ta.value = ''; S.drafts[id] = ''; autosize(ta);
  CHATS[id].push({t:'user', text});
  const script = id === 'atlas' && !S.sentOnce.atlas ? ATLAS_SCRIPT : genericScript(id);
  S.sentOnce[id] = true;
  const L = S.live = {agent:id, t0:Date.now(), steps:[], reply:'', timers:[], script, mid:'m' + Date.now()};
  script.steps.forEach((st, i) => {
    L.timers.push(setTimeout(() => { L.steps[i] = {ic:st.ic, live:st.live, done:st.done, detail:st.detail, session:st.session, state:'run'}; patchLive(); }, st.at));
    L.timers.push(setTimeout(() => { if (L.steps[i]) L.steps[i].state = 'done'; if (st.onDone) st.onDone(); patchLive(); }, st.end));
  });
  L.timers.push(setTimeout(() => {
    let pos = 0;
    L.iv = setInterval(() => {
      pos = Math.min(script.reply.length, pos + 3 + Math.floor(Math.random() * 4));
      L.reply = script.reply.slice(0, pos); patchLive();
      if (pos >= script.reply.length) { clearInterval(L.iv); finishTurn(); }
    }, 28);
  }, script.replyAt));
  L.tick = setInterval(() => { const el = $('#live-el'); if (el) el.textContent = fmtDur(Date.now() - L.t0); }, 250);
  S.pinned = true;
  renderFeed(); renderCompBar(); renderRail(); renderTabs();
  ta.focus();
}
function liveHTML(){
  const L = S.live;
  return `<div class="msg-agent" id="live-turn"><div class="act live" role="status"><span class="pulse" aria-hidden="true"></span><span>Working</span><span class="dur" id="live-el">${fmtDur(Date.now() - L.t0)}</span><button class="act-stop" data-a="stop">${ic('stop', 12)}Stop</button></div>
    <ol class="steps" id="live-steps">${liveSteps()}</ol><div class="prose" id="live-reply">${replyParas(L.reply, true)}</div></div>`;
}
function liveSteps(){
  const L = S.live; if (!L) return '';
  const steps = L.steps.filter(Boolean);
  if (!steps.length) return `<li><div class="step-row st-run"><span class="st-ic"><span class="spin"></span></span><span class="lbl">Reading your message…</span></div></li>`;
  return steps.map(s => `<li><div class="step-row st-${s.state}"><span class="st-ic">${s.state === 'run' ? '<span class="spin"></span>' : ic(s.ic, 14)}</span><span class="lbl">${esc(s.state === 'run' ? s.live + '…' : s.done)}</span></div></li>`).join('');
}
function replyParas(t, caret){
  if (!t) return '';
  const ps = t.split('\n\n');
  return ps.map((p, i) => `<p>${esc(p)}${caret && i === ps.length - 1 ? '<span class="caret" aria-hidden="true"></span>' : ''}</p>`).join('');
}
function patchLive(){
  if (!S.live) return;
  const st = $('#live-steps'); if (st) st.innerHTML = liveSteps();
  const rp = $('#live-reply'); if (rp) rp.innerHTML = replyParas(S.live.reply, true);
  stick();
}
function clearLive(L){ L.timers.forEach(clearTimeout); clearInterval(L.iv); clearInterval(L.tick); }
function finishTurn(){
  const L = S.live; if (!L) return; clearLive(L);
  CHATS[L.agent].push({t:'agent', id:L.mid, act:{summary:L.script.summary, dur:fmtDur(Date.now() - L.t0), steps:L.script.steps.map(s => ({ic:s.ic, label:s.done, detail:s.detail, session:s.session}))}, html:L.script.html});
  const a = AGENTS[L.agent]; a.last = L.script.reply.split('\n\n')[0].slice(0, 120); a.lastAt = clock();
  STREAM.unshift({tm:clock(), id:L.agent, tx:'replied in your conversation'});
  S.live = null; afterLive(L.agent);
}
function stopTurn(){
  const L = S.live; if (!L) return; clearLive(L);
  const done = L.steps.filter(Boolean).map(s => ({ic:s.ic, label:s.state === 'run' ? `${s.live} (stopped)` : s.done, detail:s.state === 'run' ? 'Stopped before this finished.' : s.detail, session:s.state === 'run' ? null : s.session, state:s.state === 'run' ? 'stopped' : 'done'}));
  const html = (L.reply ? replyParas(L.reply, false) : '') + '<p class="note">You stopped this reply.</p>';
  CHATS[L.agent].push({t:'agent', id:L.mid, act:{summary:'Stopped by you', dur:fmtDur(Date.now() - L.t0), steps:done.length ? done : [{ic:'x', label:'Stopped before any steps ran', detail:'Nothing was changed.', state:'stopped'}]}, html});
  S.live = null; afterLive(L.agent);
  toast(`Stopped ${L.agent}'s reply.`);
}
function afterLive(id){
  renderFeed(); renderCompBar(); renderRail(); renderTabs();
  if ((S.route.kind === 'agent' && S.route.view === 'activity') || S.route.kind === 'home') renderMain();
  if (!(S.route.kind === 'agent' && S.route.agent === id && S.route.view === 'chat')) { AGENTS[id].unread += 1; renderRail(); renderTabs(); if (S.route.kind === 'home') renderMain(); }
}
const T0 = Date.now();
function clock(){ const m = 14 * 60 + 10 + Math.floor((Date.now() - T0) / 60000); return `${String(Math.floor(m / 60) % 24).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`; }

/* ── activity / schedule / files ───────────────────── */
function rowHTML(s, sid){
  const warn = s.status === 'unreachable';
  const actions = sid === 'laptop'
    ? `<button class="btn ghost sm" data-a="session-stop" data-id="${sid}">Stop</button><button class="btn ghost sm" data-a="unwatch" data-id="${sid}">Stop watching</button>`
    : (s.status === 'working' || s.status === 'idle') ? `<button class="btn ghost sm" data-a="session-stop" data-id="${sid}" aria-label="Stop: ${esc(s.title)}">${ic('stop', 12)}Stop</button>` : '';
  const sub = warn ? `<span class="err">Can't reach laptop for ${esc(s.since)}. Still retrying.</span>` : `<span>${esc(s.who)}</span><span>${esc(s.kind)}</span>`;
  return `<li class="row${warn ? ' warn' : ''}"><button class="row-main" data-a="panel" data-type="session" data-id="${sid}"><span class="row-ic">${ic(warn ? 'alert' : s.ic, 15)}</span><span class="row-text"><span class="row-title">${esc(s.title)}</span><span class="row-sub">${sub}</span></span><span class="row-status">${chip(s)}</span></button><div class="row-actions">${actions}</div></li>`;
}
function activityView(id){
  const run = RUNNING[id] || [], fin = FINISHED[id] || [], sch = SCHED[id] || [];

  const finHTML = fin.length ? `<ul class="rows">${fin.map(x => `<li class="row${x.ok ? '' : ' bad'}"><div class="row-main"><span class="row-ic">${ic(x.ok ? x.ic : 'alert', 15)}</span><span class="row-text"><span class="row-title">${esc(x.title)}</span><span class="row-sub"><span class="${x.ok ? '' : 'err'}">${esc(x.out)}</span><span>${esc(x.who)}</span></span></span><span class="row-status note">${esc(x.when)}</span></div></li>`).join('')}</ul>` : `<p class="empty-line">Nothing finished yet.</p>`;
  return `<div class="view">${topbar('Activity', `What ${esc(id)} is doing and has done`)}
    <div class="page"><div class="page-inner">
      <section class="sec"><h2 class="sec-h">Running now ${run.length ? `<span class="count">${run.length}</span>` : ''}</h2>${runHTML}</section>
      <section class="sec"><h2 class="sec-h">Coming up</h2>${schHTML}</section>

function scheduleView(id){

/* ── settings (one modal, agent picker at the top) ─── */
function draftFor(id){
  const a = AGENTS[id];
  if (!S.sd[id]) S.sd[id] = {provider:a.provider, model:a.model, thinking:a.thinking, ov:Object.assign({}, a.ov)};
  return S.sd[id];
}
function isDirty(id){
  const a = AGENTS[id], d = S.sd[id]; if (!d) return false;
  return d.provider !== a.provider || d.model !== a.model || d.thinking !== a.thinking || JSON.stringify(d.ov) !== JSON.stringify(a.ov);
}
function teamDraft(){ if (!S.teamDraft) S.teamDraft = Object.assign({}, S.team); return S.teamDraft; }
function teamDirty(){ const d = S.teamDraft; return !!d && (d.name !== S.team.name || d.tz !== S.team.tz); }
function sectionsFor(scope){ return scope === 'all' ? [ALL_SECTIONS, ALL_ADV] : [AGENT_SECTIONS, AGENT_ADV]; }
function head(title, lede){ return `<h2 id="set-title">${title}</h2><p class="set-lede">${lede}</p>`; }
function savebarHTML(target, invalid){
  return `<div class="savebar" role="region" aria-label="Unsaved changes"><span class="grow">You have unsaved changes.</span><button class="btn ghost sm" data-a="discard" data-agent="${target}">Discard</button><button class="btn primary sm" data-a="save" data-agent="${target}"${invalid ? ' disabled' : ''}>Save changes</button></div>`;
}
function modelSection(id){
  const a = AGENTS[id], d = draftFor(id), P = PROVIDERS[d.provider];
  const invalid = !P.models.some(m => m[0] === d.model);
  const models = (invalid ? `<option value="${esc(d.model)}" selected>${esc(d.model)} (not offered)</option>` : '') + P.models.map(([v, l]) => `<option value="${v}"${d.model === v ? ' selected' : ''}>${l}</option>`).join('');
  const ovOpts = cur => `<option value="same"${cur === 'same' ? ' selected' : ''}>Same as main model</option>` + P.models.map(([v, l]) => `<option value="${v}"${cur === v ? ' selected' : ''}>${l}</option>`).join('');
  let banner = '';
  if (a.state === 'failed' && !isDirty(id) && !modelInfo(a)) banner = `<div class="inline-banner bad">${ic('alert', 16)}<span class="grow">${esc(id)} couldn't start because ${esc(PROVIDERS[a.provider].label)} doesn't offer “${esc(a.model)}”. Pick one of its models below.</span></div>`;
  else if (S.saved[id] && a.state === 'failed') banner = `<div class="inline-banner">${ic('check', 16)}<span class="grow">Saved. ${esc(id)} is still stopped. Restart it to use ${esc(modelLong(a.provider, a.model))}.</span><button class="btn primary sm" data-a="restart" data-agent="${id}">${ic('restart', 14)}Restart ${esc(id)}</button></div>`;
  else if (a.state === 'starting') banner = `<div class="inline-banner" role="status"><span class="spin"></span><span class="grow">Starting ${esc(id)}…</span></div>`;
  return head('Model', `Which model ${esc(id)} thinks with, and how hard it thinks before replying.`) + banner + `

function captureFocus(root){
  const a = document.activeElement;
  if (!a || !root.contains(a) || !a.id) return null;
  let st = null, en = null;
  try { st = a.selectionStart; en = a.selectionEnd; } catch (e) { /* not a text field */ }
  return {id:a.id, st, en};
}
function restoreFocus(k){
  const el = document.getElementById(k.id); if (!el) return false;
  el.focus({preventScroll:true});
  try { if (k.st != null) el.setSelectionRange(k.st, k.en); } catch (e) { /* not a text field */ }
  return true;
}

function renderSettings(){
  const root = $('#modal'), st = S.settings;
  if (!st) { root.hidden = true; root.innerHTML = ''; root.dataset.key = ''; root.dataset.body = ''; return; }
  const keep = captureFocus(root);
  const scope = st.scope;
  const [secs, adv] = sectionsFor(scope), all = secs.concat(adv);
  const section = st.section && all.some(x => x[0] === st.section) ? st.section : null;
  const shown = section || secs[0][0];
  const key = `${scope}/${shown}`, prevKey = root.dataset.key || '', prevBody = root.dataset.body || '';
  const fresh = !$('#m-card');
  if (fresh) {
    root.hidden = false;
    root.innerHTML = `<div class="modal" data-modal><div class="modal-card" id="m-card" role="dialog" aria-modal="true" aria-labelledby="set-title">

    </div></div>`;
  }
  const changed = key !== prevKey;
  $('#m-card').classList.toggle('show-body', !!section);
  $('#m-nav').innerHTML = settingsNavHTML(scope, shown);
  $('#m-back').setAttribute('data-go', `settings-${scope}`);
  $('#m-inner').innerHTML = `<div class="m-content${changed && !fresh ? ' swap' : ''}">${sectionBody(scope, shown)}</div>`;
  if (changed) $('#m-body').scrollTop = 0;
  const bodyNow = section ? '1' : '0';
  root.dataset.key = key; root.dataset.body = bodyNow;
  if (keep && restoreFocus(keep)) return;
  if (fresh || changed || bodyNow !== prevBody) {
    let f;
    if (narrow()) f = section ? $('#m-back') : $('#scope');
    else f = fresh ? $('#scope') : $('#m-nav .m-link.on');
    if (f) f.focus({preventScroll:true});
  }
}

function budgetHTML(id){

function paletteItems(){

  items.push({g:'Go to', label:'Home', hint:'Your team', ic:'home', go:'home'});
  [['Workbench','grid','workbench'],['Shared files','folder','shared-files'],['Inbox','inbox','inbox']].forEach(([l, i, h]) => items.push({g:'Go to', label:l, hint:'Team', ic:i, go:h}));
  ORDER.forEach(id => items.push({g:'Agents', label:id, hint:stateText(id), html:glyph(id), go:`${id}-chat`}));
  PLACES.forEach(([v, l, i]) => items.push({g:`In ${a}`, label:l, hint:a, ic:i, go:`${a}-${v}`}));
  (RUNNING[a] || []).forEach(k => { const s = SESSIONS[k]; items.push({g:'Running now', label:s.title, hint:s.who, ic:s.ic, run:() => openPanel('session', k)}); });
  const sc = ctxScope();
  items.push({g:'Settings', label:'Open settings', hint:sc === 'all' ? 'All agents' : `${sc} settings`, ic:'gear', run:() => openSettings()});

  ALL_SECTIONS.concat(ALL_ADV).forEach(([k, l]) => items.push({g:'Settings', label:l, hint:'All agents', ic:'sliders', run:() => openSettings('all', k)}));
  items.push({g:'Actions', label:'Summarize older messages now', hint:a, ic:'layers', run:() => summarize(a)});
  items.push({g:'Actions', label:'Reload settings', hint:'Every agent', ic:'restart', run:() => toast('Reloaded settings for every agent.')});
  items.push({g:'Actions', label:"Show what's in the agent's memory budget", hint:a, ic:'memory', run:() => openPanel('memory', a)});
  if (S.live) items.push({g:'Actions', label:'Stop the current reply', hint:S.live.agent, ic:'stop', run:stopTurn});
  items.push({g:'Actions', label:'Create an agent', hint:'Home', ic:'plus', run:newAgent});
  items.push({g:'Mockup', label:'Simulate a dropped connection', hint:'Demo', ic:'wifi', run:demoDrop});

}
function palFiltered(){
  const q = S.layer.q.trim().toLowerCase();

  return all.filter(x => (x.label + ' ' + x.hint + ' ' + x.g).toLowerCase().indexOf(q) !== -1);

function palListHTML(){
  const L = S.layer, list = L.list = palFiltered();
  if (!list.length) return `<div class="pal-empty">Nothing matches “${esc(L.q)}”. Try an agent name, a place, or a setting.</div>`;
  if (L.idx >= list.length) L.idx = list.length - 1;

  list.forEach((x, i) => {
    if (x.g !== grp) { grp = x.g; out += `<div class="pal-grp" role="presentation">${esc(grp)}</div>`; }

}

function closeLayer(restore = true){
  const from = S.layer && S.layer.from;
  S.layer = null; renderLayer();
  if (restore && from && document.body.contains(from)) from.focus();
}
function openLayer(type, t, extra){
  S.layer = Object.assign({type, from:t, rect:t ? t.getBoundingClientRect() : null}, extra || {});
  renderLayer();
}

/* ── actions ───────────────────────────────────────── */
function setAgentState(id, st){ AGENTS[id].state = st; renderAll(); }
function startAgent(id){
  const a = AGENTS[id]; setAgentState(id, 'starting');
  setTimeout(() => {
    if (!modelInfo(a)) {
      a.tried = 'just now'; a.retryNote = 'Tried again just now. Same problem: the model needs fixing first.';
      setAgentState(id, 'failed'); toast(`${id} still couldn't start. Fix the model first.`);
    } else {
      a.retryNote = null; S.saved[id] = false; a.now = a.now === "Couldn't start" || a.now === 'Stopped' ? 'Waiting for something to do' : a.now;
      STREAM.unshift({tm:clock(), id, tx:'started'}); setAgentState(id, 'running'); toast(`${id} is running.`);
    }
  }, 1300);
}
function summarize(id){ toast(`${id} is summarizing older messages. This takes about a minute.`); }
function demoDrop(){
  S.degraded = true; renderMain();
  setTimeout(() => { S.degraded = false; renderMain(); toast('Connection is back.'); }, 5000);
}
function newAgent(from){
  if (S.drawer) { S.drawer = false; S.drawerFrom = null; applyDrawer(); renderTabs(); }

  openLayer('create', from || document.activeElement);
}
function removeRunning(id){
  const s = SESSIONS[id]; const list = RUNNING[s.agent]; const i = list.indexOf(id);
  if (i !== -1) list.splice(i, 1);
}
function refreshAfterSession(){
  renderRail(); renderTabs();

  renderPanel();
}

  'sched-run':(t) => { const x = SCHED[t.dataset.agent].find(y => y.id === t.dataset.id); toast(`Running “${x.title}” now. It shows up in Activity.`); },
  'sched-pause':(t) => { const x = SCHED[t.dataset.agent].find(y => y.id === t.dataset.id); x.paused = !x.paused; renderMain(); toast(x.paused ? `Paused “${x.title}”.` : `Resumed “${x.title}”.`); },
  'draft-think':(t) => { draftFor(t.dataset.agent).thinking = t.dataset.v; renderSettings(); },
  save:(t) => {
    const id = t.dataset.agent;
    if (id === 'all') { S.team = Object.assign({}, S.teamDraft); S.teamDraft = null; renderSettings(); toast('Saved. Every agent uses these settings now.'); return; }
    const a = AGENTS[id], d = S.sd[id];
    Object.assign(a, {provider:d.provider, model:d.model, thinking:d.thinking, ov:Object.assign({}, d.ov)});
    S.sd[id] = null; S.saved[id] = true;
    renderAll();
    toast(a.state === 'failed' ? `Saved. Restart ${id} to use ${modelLong(a.provider, a.model)}.` : `Saved. ${id} uses ${modelLong(a.provider, a.model)} from its next reply.`);
  },
  discard:(t) => { if (t.dataset.agent === 'all') S.teamDraft = null; else S.sd[t.dataset.agent] = null; renderSettings(); toast('Discarded your changes.'); },
  disconnect:(t) => { CONN[t.dataset.agent][t.dataset.svc].connected = false; renderSettings(); toast(`Disconnected ${t.dataset.svc === 'discord' ? 'Discord' : 'Telegram'}. The saved token was removed.`); },
  'inbox-open':(t) => { const x = INBOX.find(y => y.id === t.dataset.id); S.inboxOpen = S.inboxOpen === x.id ? null : x.id; x.unread = false; renderMain(); renderRail(); renderTabs(); },
  'inbox-go':(t) => { const x = INBOX.find(y => y.id === t.dataset.id); S.inboxOpen = x.id; x.unread = false; S.inboxTab = 'inbox'; go('inbox'); },
  'inbox-done':(t) => { const x = INBOX.find(y => y.id === t.dataset.id); x.done = true; x.unread = false; renderMain(); renderRail(); renderTabs(); toast(`Marked “${x.title}” done.`); },
  'inbox-undo':(t) => { const x = INBOX.find(y => y.id === t.dataset.id); x.done = false; renderMain(); },
  'inbox-tab':(t) => { S.inboxTab = t.dataset.v; renderMain(); },
  'ask-about':(t) => { const x = INBOX.find(y => y.id === t.dataset.id); S.drafts[x.agent] = `About “${x.title}”: `; go(`${x.agent}-chat`); setTimeout(() => { const m = $('#msg'); if (m) { m.focus(); m.setSelectionRange(m.value.length, m.value.length); } }, 30); },
  'ask-file':(t) => { const a = S.lastAgent; S.drafts[a] = `About ${t.dataset.id}: `; go(`${a}-chat`); setTimeout(() => { const m = $('#msg'); if (m) m.focus(); }, 30); },
  summarize:(t) => summarize(t.dataset.agent),
  'tip-pct':(t) => { S.tip.pct = +t.dataset.v; renderPanel(); }
};

document.addEventListener('click', e => {
  if (e.target.matches && e.target.matches('[data-modal]')) { closeSettings(); return; }
  const t = e.target.closest('[data-a],[data-go]'); if (!t || t.disabled) return;
  if (t.dataset.a) { const fn = ACT[t.dataset.a]; if (fn) { e.preventDefault(); fn(t, e); } return; }
  if (t.dataset.go) {
    e.preventDefault();
    const from = S.layer ? S.layer.from : null;
    if (S.layer) closeLayer(false);
    if (t.dataset.go.indexOf('settings-') === 0 && !S.settings) S.settingsFrom = from || t;
    go(t.dataset.go);
  }
});
document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  if (f.id === 'composer') send(f.dataset.agent);
  else if (f.id === 'pcomposer') {
    const ta = $('#pmsg'), v = ta.value.trim(); if (!v) return;
    const s = SESSIONS[f.dataset.sid]; const w = s.tr.findIndex(x => x.k === 'working');
    const entry = {k:'you', text:v}; if (w === -1) s.tr.push(entry); else s.tr.splice(w, 0, entry);
    ta.value = ''; renderPanel();
    setTimeout(() => { const w2 = s.tr.findIndex(x => x.k === 'working'); const r = {k:'agent', html:"<p>Got it. I'll factor that in.</p>"}; if (w2 === -1) s.tr.push(r); else s.tr.splice(w2, 0, r); if (S.panel && S.panel.id === f.dataset.sid) renderPanel(); }, 1200);
  } else if (f.id === 'create-agent') {
    const n = $('#new-name'), name = n.value.trim(), err = $('#new-name-err');
    let msg = '';
    if (!name) msg = 'Give the agent a name.';
    else if (!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(name) || name.length > 24) msg = 'Use up to 24 lowercase letters, numbers and single hyphens, like research-buddy.';
    else if (AGENTS[name]) msg = `You already have an agent called ${name}.`;
    else if (RESERVED.indexOf(name) !== -1) msg = `“${name}” is used by Residuum itself. Pick another name.`;
    if (msg) { err.innerHTML = `${ic('alert', 14)}<span>${esc(msg)}</span>`; err.hidden = false; n.classList.add('err'); n.focus(); return; }
    const desc = $('#new-desc').value.trim() || 'New agent';
    AGENTS[name] = {desc, state:'running', provider:'anthropic', model:'claude-sonnet-5-5', thinking:'low', ov:{summarize:'same',background:'same',checks:'same'}, unread:0, auto:true, now:'Waiting for your first message', last:'Said hello.', lastAt:clock()};
    ORDER.push(name); RUNNING[name] = []; FINISHED[name] = []; SCHED[name] = []; AFILES[name] = [{d:'memory', kids:[]}];
    CONN[name] = {discord:{connected:false, others:false, ctx:20}, telegram:{connected:false, others:false, ctx:20}};
    CHATS[name] = [{t:'agent', id:'n' + Date.now(), html:`<p>Hi, I'm ${esc(name)}. You said you want help with: “${esc(desc)}”.</p><p>Tell me a bit more about how you do this today, and I'll set myself up.</p>`}];
    STREAM.unshift({tm:clock(), id:name, tx:'was created by you'});
    closeLayer(false);
    renderRail(); renderTabs(); if (S.route.kind === 'home' && !S.settings) renderMain();
    const row = document.getElementById(`ar-${name}`); if (row && !narrow()) row.focus();
    toast(`Created ${name}. It's in the sidebar and on Home.`);
  } else if (f.id === 'tg-connect') {
    const v = $('#tg-token').value.trim();
    if (!v) { $('#tg-err').hidden = false; $('#tg-token').classList.add('err'); $('#tg-token').focus(); return; }
    CONN[f.dataset.agent].telegram = Object.assign(CONN[f.dataset.agent].telegram, {connected:true, tail:v.slice(-4)});
    renderSettings(); toast('Connected Telegram.');
  }
});
document.addEventListener('change', e => {
  const t = e.target, f = t.dataset && t.dataset.f; if (!f) return;
  if (f === 'scope') {
    const sc = t.value, cur = S.settings && S.settings.section;
    const [a, b] = sectionsFor(sc), all = a.concat(b);
    const keepSec = cur && all.some(x => x[0] === cur) ? cur : null;
    go(keepSec ? `settings-${sc}-${keepSec}` : (narrow() ? `settings-${sc}` : `settings-${sc}-${a[0][0]}`));
    return;
  }
  if (f === 'team-tz') { teamDraft().tz = t.value; renderSettings(); return; }
  if (f === 'team-name') return;
  const id = t.dataset.agent; if (!id) return;
  const d = draftFor(id);
  if (f === 'provider') { d.provider = t.value; d.model = PROVIDERS[t.value].models[0][0]; d.ov = {summarize:'same',background:'same',checks:'same'}; }
  else if (f === 'model') d.model = t.value;
  else if (f === 'ov') d.ov[t.dataset.k] = t.value;
  renderSettings();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'msg') { S.drafts[S.route.agent] = t.value; autosize(t); }
  else if (t.id === 'pmsg') autosize(t);
  else if (t.id === 'pal-q') { S.layer.q = t.value; S.layer.idx = 0; updatePal(); }
  else if (t.id === 'team-name') { teamDraft().name = t.value; renderSettings(); }
  else if (t.id === 'tip-bill' || t.id === 'tip-people') {
    S.tip.bill = parseFloat($('#tip-bill').value) || 0; S.tip.people = parseInt($('#tip-people').value, 10) || 1;
    const each = (S.tip.bill * (1 + S.tip.pct / 100)) / Math.max(1, S.tip.people);
    $('#tip-out').innerHTML = `$${each.toFixed(2)}<span>each, with a ${S.tip.pct}% tip</span>`;
  } else if (t.id === 'new-name') { $('#new-name-err').hidden = true; t.classList.remove('err'); }
});
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); if (S.layer && S.layer.type === 'palette') closeLayer(); else ACT.palette(); return; }
  const t = e.target;
  if (t.id === 'pal-q') {
    const L = S.layer, n = (L.list || []).length;
    if (e.key === 'ArrowDown') { e.preventDefault(); L.idx = n ? (L.idx + 1) % n : 0; updatePal(); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); L.idx = n ? (L.idx - 1 + n) % n : 0; updatePal(); return; }
    if (e.key === 'Enter') { e.preventDefault(); runPal(L.idx); return; }
  }
  if ((t.id === 'msg' || t.id === 'pmsg') && e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); t.form.requestSubmit(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && t.getAttribute && t.getAttribute('role') === 'link' && t.dataset.go) { e.preventDefault(); go(t.dataset.go); return; }
  if (e.key === 'Escape') {
    if (S.layer) { e.preventDefault(); closeLayer(); return; }
    if (S.settings) { e.preventDefault(); closeSettings(); return; }
    if (S.drawer) { e.preventDefault(); closeDrawer(); return; }
    if (S.panel) { e.preventDefault(); ACT['close-panel'](); return; }
  }
});
document.addEventListener('scroll', e => {
  if (e.target && e.target.id === 'feed') { const f = e.target; S.pinned = f.scrollHeight - f.scrollTop - f.clientHeight < 80; }
}, true);

/* drawer swipe (phone): drag the drawer left to close it */
let swipe = null;
document.addEventListener('touchstart', e => {
  if (!S.drawer || !narrow() || !e.target.closest || !e.target.closest('#rail')) return;
  swipe = {x:e.touches[0].clientX, y:e.touches[0].clientY, dx:0, horiz:null};
}, {passive:true});
document.addEventListener('touchmove', e => {
  if (!swipe) return;
  const dx = e.touches[0].clientX - swipe.x, dy = e.touches[0].clientY - swipe.y;
  if (swipe.horiz === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) swipe.horiz = Math.abs(dx) > Math.abs(dy);
  if (!swipe.horiz) return;
  swipe.dx = Math.min(0, dx);
  const rail = $('#rail'); rail.classList.add('dragging'); rail.style.transform = `translateX(${swipe.dx}px)`;
}, {passive:true});
document.addEventListener('touchend', () => {
  if (!swipe) return;
  const rail = $('#rail'); rail.classList.remove('dragging'); rail.style.transform = '';
  if (swipe.dx < -70) closeDrawer();
  swipe = null;
});

/* panel resize */
let drag = null;
document.addEventListener('pointerdown', e => {
  const g = e.target.closest && e.target.closest('[data-grip]'); if (!g) return;
  drag = g; g.classList.add('drag'); g.setPointerCapture(e.pointerId); e.preventDefault();
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  const max = Math.min(760, window.innerWidth - 520);
  const w = Math.max(340, Math.min(max, window.innerWidth - e.clientX));
  document.documentElement.style.setProperty('--panel-w', w + 'px');
});
document.addEventListener('pointerup', () => {
  if (!drag) return; drag.classList.remove('drag'); drag = null;
  store.set('combined-panel-w', getComputedStyle(document.documentElement).getPropertyValue('--panel-w').trim());
});
const savedW = store.get('combined-panel-w'); if (savedW) document.documentElement.style.setProperty('--panel-w', savedW);
window.addEventListener('resize', () => { if (S.layer && S.layer.type !== 'palette' && S.layer.type !== 'create') closeLayer(false); if (!narrow() && S.drawer) { S.drawer = false; applyDrawer(); renderTabs(); } });

/* boot */
if (!location.hash) history.replaceState(null, '', '#home');
route();
})();
</script>

</body>
</html>
