project = "residuum"

# Entries under [checks.*] are exceptions to what the recorder works out itself.
# Defaults: the kind comes from the words in the check id (a `gate-` prefix is a
# gate), and reads is the top-level directory the check ran in. An entry gives
# only the keys that differ: a `kind` the id does not reveal, and a `reads` list
# narrower than the directory, and a `ceiling`, the worst damage level the check
# can catch (a `format` check is capped at 0 without one). A `reads` item naming
# a key of [paths] stands for that list. CI steps below are matched to the same
# ids.

[paths]
rust-src = ["src/**", "crates/**", "tests/**", "assets/**", ".cargo/**", "build.rs", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml"]
# What a build of the library and binary targets compiles: no integration tests.
rust-build-src = ["src/**", "crates/**", "assets/**", ".cargo/**", "build.rs", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml"]
# Repository files the Rust tests read beyond the Rust sources: hub's update test embeds release.yml, and the source and manifest scans read ci.yml and run affected-packages.sh.
rust-test-files = [".github/workflows/release.yml", ".github/workflows/ci.yml", "scripts/affected-packages.sh"]
# What `vite build` reads to produce web/dist, which the Rust build embeds; vite.config.ts imports the mock plugin and src/test/guard.ts.
web-app = ["web/src/**", "web/public/**", "web/build/**", "web/mock/**", "web/index.html", "web/package.json", "web/package-lock.json", "web/tsconfig.json", "web/vite.config.ts", "web/svelte.config.js", "web/app-shell-csp.txt"]
web-src = ["web/src/**", "web/build/**", "web/mock/**"]
web-config = ["web/package.json", "web/package-lock.json", "web/tsconfig.json", "web/vite.config.ts", "web/svelte.config.js"]
# The Playwright suite through scripts/with-e2e-browser.sh, which falls back to the Playwright container.
web-e2e = ["web/src/**", "web/public/**", "web/build/**", "web/mock/**", "web/index.html", "web/package.json", "web/package-lock.json", "web/tsconfig.json", "web/vite.config.ts", "web/svelte.config.js", "web/app-shell-csp.txt", "web/e2e/**", "web/playwright.config.ts", "scripts/with-e2e-browser.sh", "scripts/with-loopback-network.sh", "scripts/with-playwright-container.sh"]
# The Playwright suite run straight in the Playwright container.
web-e2e-container = ["web/src/**", "web/public/**", "web/build/**", "web/mock/**", "web/index.html", "web/package.json", "web/package-lock.json", "web/tsconfig.json", "web/vite.config.ts", "web/svelte.config.js", "web/app-shell-csp.txt", "web/e2e/**", "web/playwright.config.ts", "scripts/with-playwright-container.sh"]
manifests = ["Cargo.toml", "Cargo.lock"]
ci-failures = ["scripts/ci-failures*", "scripts/ci-failures-fixtures/**", "scripts/stress-issues*"]

[checks.rust-fmt]
reads = ["src/**", "crates/**", "tests/**", "build.rs", "Cargo.toml", "rustfmt.toml", "rust-toolchain.toml"]

[checks.rust-clippy]
reads = ["rust-src", "web-app", "clippy.toml", ".github/workflows/release.yml"]

[checks.rust-clippy-cross]
reads = ["rust-src", "web-app", "clippy.toml", ".github/workflows/release.yml"]

[checks.rust-clippy-macos]
reads = ["rust-src", "web-app", "clippy.toml", ".github/workflows/release.yml"]

[checks.rust-doc]
ceiling = 0
kind = "lint"
reads = ["rust-build-src", "web-app"]

[checks.rust-test]
reads = ["rust-src", "web-app", "rust-test-files"]

[checks.rust-test-windows]
reads = ["rust-src", "web-app", "rust-test-files"]

[checks.rust-stress]
reads = ["rust-src", "web-app", "rust-test-files", "scripts/stress-tests.sh"]

[checks.rust-pebble]
kind = "e2e"
reads = ["crates/**", "assets/**", "web/src/styles/tokens.css", "manifests", "rust-toolchain.toml"]

[checks.rust-types]
ceiling = 2
reads = ["src/**", "crates/**", "tests/ts_export.rs", "assets/**", ".cargo/**", "build.rs", "manifests", "rust-toolchain.toml", "web-app", "scripts/check-generated-types.sh", "scripts/export-generated-types.sh"]

[checks.rust-shear]
ceiling = 0
reads = ["src/**", "crates/**", "tests/**", "build.rs", "manifests"]

[checks.rust-deny]
reads = ["manifests", "deny.toml", "crates/**/Cargo.toml"]

[checks.rust-build]
reads = ["rust-build-src", "web-app", "scripts/build-binary.sh"]

[checks.rust-isolation]
kind = "typecheck"
reads = ["rust-build-src", "web-app", ".github/workflows/release.yml", "scripts/check-crate-isolation.sh"]

[checks.web-fmt]
reads = ["web-src", "web/e2e/**", "web/scripts/**", "web/playwright.config.ts", "web/.prettierrc", "web/.prettierignore", "web/package.json", "web/package-lock.json"]

[checks.web-lint]
reads = ["web-src", "web/e2e/**", "web/scripts/**", "web/playwright.config.ts", "web/eslint.config.js", "web/stylelint.config.js", "web-config"]

[checks.web-typecheck]
reads = ["web-src", "web/e2e/**", "web/scripts/**", "web/playwright.config.ts", "web-config"]

[checks.web-test]
reads = ["web-src", "web/scripts/**", "web/app-shell-csp.txt", "web-config"]

[checks.web-coverage]
kind = "unit"
reads = ["web-src", "web/scripts/**", "web/app-shell-csp.txt", "web-config"]

[checks.web-build]
reads = "web-app"

[checks.web-e2e-fast]
reads = "web-e2e"

[checks.web-e2e]
reads = "web-e2e"

[checks.web-e2e-webkit]
reads = "web-e2e-container"

# Runs only in CI, in a job that is continue-on-error and outside the CI gate: nothing waits on it.
[checks.web-e2e-visual]
ceiling = 1
blocks = false
reads = "web-e2e-container"

[checks.web-stress]
reads = ["web-e2e", "scripts/web-stress.sh"]

[checks.actionlint]
kind = "lint"
reads = [".github/workflows/**", ".github/actionlint.yaml"]

[checks.scripts-ci-failures-test]
ceiling = 0
reads = ["ci-failures"]

[checks.scripts-stress-issues-test]
ceiling = 0
kind = "unit"
reads = "ci-failures"

[checks.scripts-affected-packages-test]
ceiling = 0
reads = ["scripts/affected-packages*", "Cargo.toml", "crates/**/Cargo.toml"]

[checks.docker-build]
reads = ["rust-build-src", "web-app", "docker/Dockerfile", ".dockerignore"]

# The scheduled runs are the audit: a held-out full run that measures what the blocking checks let through.
# Its cost is outside the score, and a failure after a pass is counted as an escape.
[audit]
events = ["schedule"]

[ci]
steps = [
  { workflow = "CI", job = "Rust Lint", step = "Check formatting", check = "rust-fmt" },
  { workflow = "CI", job = "Rust Lint", step = "Clippy", check = "rust-clippy" },
  { workflow = "CI", job = "Rust Lint", step = "Rustdoc", check = "rust-doc" },
  { workflow = "CI", job = "Rust Lint", step = "Dependency audit", check = "rust-deny" },
  { workflow = "CI", job = "Rust Lint", step = "Unused dependencies", check = "rust-shear" },
  { workflow = "CI", job = "Clippy (x86_64-pc-windows-gnu)", step = "Clippy", check = "rust-clippy-cross" },
  { workflow = "CI", job = "Rust Tests", step = "Build test binaries", check = "rust-test" },
  { workflow = "CI", job = "Rust Tests", step = "Tests", check = "rust-test" },
  { workflow = "CI", job = "Rust Tests", step = "Pebble tests", check = "rust-pebble" },
  { workflow = "CI", job = "Rust Tests", step = "Generated types are up to date", check = "rust-types" },
  { workflow = "CI", job = "Crate Isolation", step = "Check the root library and each member crate alone", check = "rust-isolation" },
  { workflow = "CI", job = "Web Checks", step = "Web format check", check = "web-fmt" },
  { workflow = "CI", job = "Web Checks", step = "Web lint", check = "web-lint" },
  { workflow = "CI", job = "Web Checks", step = "Web type check", check = "web-typecheck" },
  { workflow = "CI", job = "Web Checks", step = "Web unit tests", check = "web-coverage" },
  { workflow = "CI", job = "Web Checks", step = "Build web assets", check = "web-build" },
  { workflow = "CI", job = "Web Tests (Node ${{ matrix.node }})", step = "Web unit tests", check = "web-test" },
  { workflow = "CI", job = "Web End-to-End (${{ matrix.shard }}/4)", step = "Web end-to-end tests", check = "web-e2e-fast" },
  { workflow = "CI", job = "Web Visual Comparisons", step = "Web visual comparisons", check = "web-e2e-visual" },
  { workflow = "CI", job = "Clippy (aarch64-unknown-linux-gnu)", step = "Clippy", check = "rust-clippy-cross" },
  { workflow = "CI", job = "Clippy (aarch64-apple-darwin)", step = "Clippy", check = "rust-clippy-macos" },
  { workflow = "CI", job = "Tests (Windows)", step = "Test", check = "rust-test-windows" },
  { workflow = "CI", job = "Docker Source Image", step = "Build docker/Dockerfile", check = "docker-build" },
  { workflow = "CI", job = "Actionlint", step = "Lint workflows", check = "actionlint" },
  { workflow = "Cross-Platform Checks", job = "Clippy (aarch64-unknown-linux-gnu)", step = "Clippy", check = "rust-clippy-cross" },
  { workflow = "Cross-Platform Checks", job = "Clippy (aarch64-apple-darwin)", step = "Clippy", check = "rust-clippy-macos" },
  { workflow = "Cross-Platform Checks", job = "Tests (Windows)", step = "Test", check = "rust-test-windows" },
  { workflow = "Nightly Stress", job = "Rust Stress", step = "Build test binaries", check = "rust-test" },
  { workflow = "Nightly Stress", job = "Rust Stress", step = "Tests", check = "rust-test" },
  { workflow = "Nightly Stress", job = "Rust Stress", step = "Stress", check = "rust-stress" },
  { workflow = "Nightly Stress", job = "Web Stress (${{ matrix.shard }}/4)", step = "Web stress", check = "web-stress" },
]

# Steps that only prepare for checks: installs, toolchain and runtime setup, target and cache setup, web assets built so Rust can compile.
setup = ["Install *", "Setup *", "Add target", "Build web assets", "Cache *", "Post Cache *"]

# Bear sets the damage levels. The first matching entry wins; a path no entry matches is level 0.

# Installs and updates on the user's machine, and the release workflow that publishes what they install.
[[areas]]
paths = ["scripts/install.sh", ".github/workflows/release.yml", "bundle/install-app.sh"]
level = 4

[[areas]]
paths = ["docs/**", "**/*.test.ts", "tests/**", "**/tests/**", "**/tests.rs", "**/test_*.rs", "**/*_support.rs", "**/fake_*.rs", "**/fixture.rs", "**/testdata/**", "src/testing/**", "crates/**/testing.rs", "crates/**/testing/**", "crates/**/*_tests.rs", "crates/tools/golden/**", "mac/ResiduumTests/**", "scripts/**", ".githooks/**", ".github/**", "web/e2e/**", "web/mock/**", "web/scripts/**", "web/src/test/**", "web/eslint.config.js", "web/stylelint.config.js", "web/.prettierrc", "web/.prettierignore", "web/playwright.config.ts", "web/**/*.md", "*.md", "crates/*/*.md", "justfile", "clippy.toml", "rustfmt.toml", "deny.toml", "check-runs.toml"]
level = 0

# Files inside the level-4 globs below that render, word or shape and decide nothing.
[[areas]]
paths = ["crates/net/src/pairing/qr.rs", "crates/net/src/pairing/error.rs", "crates/net/src/pairing/types.rs", "crates/tracing-service/src/otel.rs"]
level = 2

# Irreversible: deleting or overwriting user data, storing or sending secrets, deciding who may reach or drive an agent, and the manifests that build that code.
[[areas]]
paths = ["Cargo.toml", "Cargo.lock", "crates/a2a/Cargo.toml", "crates/checkpoints/Cargo.toml", "crates/config/Cargo.toml", "crates/core/Cargo.toml", "crates/hub/Cargo.toml", "crates/interfaces/Cargo.toml", "crates/net/Cargo.toml", "crates/tools/Cargo.toml", "crates/tracing-service/Cargo.toml", "crates/checkpoints/src/engine.rs", "crates/checkpoints/src/backend.rs", "crates/core/src/util/fs.rs", "crates/hub/src/web/workspace.rs", "crates/hub/src/provision.rs", "crates/tools/src/write.rs", "crates/tools/src/edit.rs", "crates/config/src/secrets.rs", "crates/config/src/agent_keys/**", "crates/tools/src/exec.rs", "crates/tracing-service/src/**", "crates/hub/src/update.rs", "src/commands/update*.rs", "crates/net/src/pairing/**", "crates/hub/src/http/pairing.rs", "crates/hub/src/http/artifacts_origin.rs", "crates/hub/src/web/cloud_sign_in.rs", "crates/net/src/cross_site.rs", "crates/core/src/util/secret_compare.rs", "crates/a2a/src/auth.rs", "crates/a2a/src/keys.rs", "crates/net/src/remote_access/siblings/keys.rs", "crates/interfaces/src/teams/auth.rs", "crates/interfaces/src/webhook.rs", "crates/interfaces/src/chat_state.rs"]
level = 4

# Spends paid model usage unattended, or loses an agent's memory or conversations without being irreversible.
[[areas]]
paths = ["crates/agent/Cargo.toml", "crates/background/Cargo.toml", "crates/gateway/Cargo.toml", "crates/inference/Cargo.toml", "crates/memory/Cargo.toml", "crates/workspace/Cargo.toml", "crates/inference/src/retry.rs", "crates/inference/src/failover.rs", "crates/inference/src/attempt.rs", "crates/inference/src/pricing.rs", "crates/inference/src/usage_record.rs", "crates/inference/src/providers/**", "crates/agent/src/turn.rs", "crates/agent/src/core.rs", "crates/agent/src/auto_mode.rs", "crates/agent/src/context/**", "crates/agent/src/prefix_watch.rs", "crates/agent/src/tool_result_store.rs", "crates/agent/src/subconscious/**", "crates/background/src/runtime.rs", "crates/background/src/subagent.rs", "crates/background/src/messaging.rs", "crates/gateway/src/event_loop/pulse.rs", "crates/gateway/src/event_loop/pulse_fire.rs", "crates/gateway/src/pulse_fires.rs", "crates/proactivity/**", "crates/memory/src/observer/**", "crates/memory/src/reflector/**", "crates/memory/src/merge_writer.rs", "crates/memory/src/episode_store.rs", "crates/memory/src/log_store.rs", "crates/memory/src/recent_messages.rs", "crates/workspace/src/team_files.rs", "crates/tools/src/path_policy.rs", "crates/interfaces/src/outbound.rs", "crates/interfaces/src/reply_targets.rs", "crates/a2a/src/client/**"]
level = 3

[[areas]]
paths = ["crates/hub/src/overview/**", "src/logging/format.rs", "web/src/styles/**", "web/public/icons/**", "web/public/favicon.svg"]
level = 1

[[areas]]
paths = ["crates/**", "src/**", "build.rs", "assets/**", "docker/**", "mac/**", "bundle/**", "web/**", ".dockerignore", ".cargo/**", "rust-toolchain.toml"]
level = 2
