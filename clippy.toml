# Test-code exemptions.
#
# The lint block in Cargo.toml denies unwrap/expect/panic/dbg as a hard floor,
# but test code legitimately uses all four — a test that can't `.unwrap()` a
# fixture is a test drowning in ceremony. Exempting them here keeps the regime
# usable instead of forcing an #[expect] on every assertion.
#
# Because the exemption lives here, test files need NO suppression header.
# Adding `#[expect(clippy::unwrap_used, ...)]` to a test file is an error, not
# belt-and-braces: the lint is already exempt, so the expectation never fires
# and becomes an unfulfilled-expectation hard error under `-D warnings`.
#
# These four match grizzly-gate exactly, so the pre-commit hook and CI never disagree.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-dbg-in-tests = true

# Temp-dir leak guardrail.
#
# These methods disable tempfile's cleanup-on-drop, so every call leaks a
# directory or file into /tmp. Leaked test fixtures once filled /tmp's inode
# table. Hold the guard for the lifetime of the test instead.
disallowed-methods = [
    { path = "tempfile::TempDir::keep", reason = "disables temp cleanup and leaks into /tmp; hold the TempDir guard for the test's lifetime instead" },
    { path = "tempfile::TempDir::into_path", reason = "disables temp cleanup and leaks into /tmp; hold the TempDir guard for the test's lifetime instead" },
    { path = "tempfile::NamedTempFile::keep", reason = "disables temp cleanup and leaks into /tmp; hold the NamedTempFile guard for the test's lifetime instead" },
    { path = "tempfile::NamedTempFile::into_temp_path", reason = "detaches the file from its cleanup guard, risking a leak into /tmp; hold the NamedTempFile for the test's lifetime instead" },
    { path = "tempfile::TempPath::keep", reason = "disables temp cleanup and leaks into /tmp; hold the TempPath guard for the test's lifetime instead" },
]
