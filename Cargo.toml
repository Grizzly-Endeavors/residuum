[package]
name = "residuum"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[workspace]
resolver = "3"
members = ["crates/*"]
default-members = [".", "crates/*"]
exclude = [".claude", "target"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
# Workspace members
residuum-core = { path = "crates/core", version = "0.1.0" }
residuum-config = { path = "crates/config", version = "0.1.0" }
residuum-bus = { path = "crates/bus", version = "0.1.0" }
residuum-agent = { path = "crates/agent", version = "0.1.0" }
residuum-background = { path = "crates/background", version = "0.1.0" }
residuum-interfaces = { path = "crates/interfaces", version = "0.1.0" }
residuum-workspace = { path = "crates/workspace", version = "0.1.0" }
residuum-protocol = { path = "crates/protocol", version = "0.1.0" }
residuum-notify = { path = "crates/notify", version = "0.1.0" }
residuum-proactivity = { path = "crates/proactivity", version = "0.1.0" }
residuum-checkpoints = { path = "crates/checkpoints", version = "0.1.0" }
residuum-skills = { path = "crates/skills", version = "0.1.0" }
residuum-tracing-service = { path = "crates/tracing-service", version = "0.1.0" }
residuum-inference = { path = "crates/inference", version = "0.1.0" }
residuum-memory = { path = "crates/memory", version = "0.1.0" }
residuum-net = { path = "crates/net", version = "0.1.0" }
residuum-mcp = { path = "crates/mcp", version = "0.1.0" }
residuum-a2a = { path = "crates/a2a", version = "0.1.0" }
residuum-tools = { path = "crates/tools", version = "0.1.0" }
residuum-hub = { path = "crates/hub", version = "0.1.0" }
residuum-gateway = { path = "crates/gateway", version = "0.1.0" }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "signal", "io-std", "io-util", "sync", "time"] }

# HTTP client. `rustls-no-provider` keeps reqwest's rustls stack and platform
# certificate verifier but leaves the crypto provider to the process: reqwest's
# own `rustls` feature would also compile aws-lc-rs. `commands::run` installs
# ring before the first client is built.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-no-provider", "charset", "http2", "system-proxy"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.25"

# Error handling
anyhow = "1"
thiserror = "2"

# HTML content extraction
dom_smoothie = "0.15"

# Encoding
base64 = "0.22"

# Temp file management (used by bug-report editor mode)
tempfile = "3"

# Utilities
async-trait = "0.1"
rand = "0.8"
dirs = "5"
dotenvy = "0.15"
shellexpand = "3"
aes-gcm-siv = "0.11"
aes-gcm = "0.10"
aes = "0.8"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
tantivy = "0.26"
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1"
zerocopy = { version = "0.8", features = ["derive"] }
http = "1"
regex = "1"
globset = "0.4.20"
# Markdown to plain text, for message previews
pulldown-cmark = { version = "0.13", default-features = false }
rmcp = { version = "0.16", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
serde_yaml_ng = "0.10"
tokio-util = { version = "0.7", features = ["rt", "io"] }
# Unix process signals (Linux + macOS)
nix = { version = "0.29", default-features = false, features = ["signal", "process"] }
# Windows process management (the daemon)
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_Foundation"] }
fd-lock = "4"
unicode-normalization = "0.1.25"

# A2A protocol (server-side foundation: types, JSON-RPC/REST routers, task store;
# client: agent card resolution, protocol client factory, auth interceptors)
a2a = { package = "a2a-lf", version = "0.3.1", default-features = false }
a2a-server = { package = "a2a-server-lf", version = "0.4.4", default-features = false }
a2a-client = { package = "a2a-client-lf", version = "0.2.5", default-features = false }

# Workspace change feed (OS file notifications)
notify = "8.2"

# macOS native notifications
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = "0.3"
block2 = "0.6"

# Windows toast notifications
tauri-winrt-notification = "0.8.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# OpenTelemetry (trace export)
opentelemetry = "0.33.1"
opentelemetry_sdk = "0.33.1"
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["trace", "http-proto", "reqwest-client", "internal-logs"] }
opentelemetry-proto = { version = "0.33.1", features = ["gen-tonic-messages", "trace"] }
prost = "0.14"

# CLI
clap = { version = "4", features = ["derive"] }
owo-colors = { version = "4", features = ["supports-colors"] }
rpassword = "7"

# WebSocket gateway + web UI
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
# Remote access: ACME client, challenge certificates, public DNS lookups, TLS-terminated HTTP serving
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "hyper-rustls", "rcgen", "time", "x509-parser"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio"] }
hyper = { version = "1.12", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["server-auto", "tokio", "service", "http1", "http2"] }
x509-parser = "0.18.1"
ring = "0.17"
futures-util = "0.3"
tower = { version = "0.5", features = ["util"] }
# Brotli and gzip for the embedded web app's scripts, styles and JSON
tower-http = { version = "0.7.1", default-features = false, features = ["compression-br", "compression-gzip"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
rust-embed = "8"
# QR codes for pairing links (SVG for the web UI, Unicode blocks for the terminal)
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
mime_guess = "2"
iana-time-zone = "0.1"

# Discord
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "http", "model", "rustls_backend"] }

# Telegram
teloxide-core = { version = "0.13", default-features = false, features = ["rustls"] }

# TypeScript type generation (zero-cost at runtime, derive-only)
ts-rs = { version = "12.0", features = ["serde-json-impl"] }

# Workspace checkpoints: pure-Rust git object database and refs (no system
# git binary, no C toolchain to cross-compile), plus unified-diff rendering
# for checkpoint diffs (gix has no diff-formatting of its own).
gix = "0.87.1"
similar = "3.2.0"

# Test-only dependencies
ctor = "1.0.13"
wiremock = "0.6"
http-body-util = "0.1"
jsonschema = { version = "0.58.6", default-features = false }

