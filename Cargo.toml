residuum-interfaces = { workspace = true }
residuum-workspace = { workspace = true }
residuum-protocol = { workspace = true }
residuum-notify = { workspace = true }
residuum-proactivity = { workspace = true }
residuum-checkpoints = { workspace = true }
residuum-hub = { workspace = true }
