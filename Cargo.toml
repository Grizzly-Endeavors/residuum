residuum-core = { workspace = true, features = ["test-support"] }
residuum-config = { workspace = true, features = ["test-support"] }
residuum-inference = { workspace = true, features = ["test-support"] }
residuum-memory = { workspace = true, features = ["test-support"] }
residuum-net = { workspace = true, features = ["test-support"] }
residuum-bus = { workspace = true, features = ["test-support"] }
residuum-agent = { workspace = true, features = ["test-support"] }
residuum-background = { workspace = true, features = ["test-support"] }
residuum-workspace = { workspace = true, features = ["test-support"] }
residuum-a2a = { workspace = true, features = ["test-support"] }
residuum-tools = { workspace = true, features = ["test-support"] }
residuum-proactivity = { workspace = true, features = ["test-support"] }
residuum-checkpoints = { workspace = true, features = ["test-support"] }
residuum-hub = { workspace = true, features = ["test-support"] }
residuum-gateway = { workspace = true, features = ["test-support"] }
