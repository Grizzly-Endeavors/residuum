[package]
name = "residuum-notify"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
residuum-core = { workspace = true }
residuum-config = { workspace = true }
residuum-bus = { workspace = true }
residuum-workspace = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

# macOS native notifications (Apple Silicon only)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-user-notifications = { workspace = true }
block2 = { workspace = true }

# Windows toast notifications
[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = { workspace = true }

[dev-dependencies]
residuum-core = { workspace = true, features = ["test-support"] }
residuum-config = { workspace = true, features = ["test-support"] }
residuum-bus = { workspace = true, features = ["test-support"] }
residuum-workspace = { workspace = true, features = ["test-support"] }
ctor = { workspace = true }
rustls = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[package.metadata.cargo-shear]
# crates/core/src/testing/crypto.rs, which lib.rs includes by #[path], uses ctor and
# rustls. cargo-shear reads a source file only for the package whose src/ directory
# holds it, so it never sees the use here.
ignored = ["ctor", "rustls"]
