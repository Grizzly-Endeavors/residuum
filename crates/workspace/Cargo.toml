[package]
name = "residuum-workspace"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
test-support = ["dep:tempfile"]

[dependencies]
residuum-core = { workspace = true }
residuum-config = { workspace = true }
residuum-bus = { workspace = true }
residuum-inference = { workspace = true }
residuum-mcp = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
futures-util = { workspace = true }
notify = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
tempfile = { workspace = true, optional = true }
thiserror = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
ts-rs = { workspace = true }

[dev-dependencies]
residuum-core = { workspace = true, features = ["test-support"] }
residuum-config = { workspace = true, features = ["test-support"] }
residuum-bus = { workspace = true, features = ["test-support"] }
residuum-inference = { workspace = true, features = ["test-support"] }
ctor = { workspace = true }
rustls = { workspace = true }
tempfile = { workspace = true }
wiremock = { workspace = true }

[package.metadata.cargo-shear]
# crates/core/src/testing/crypto.rs, which lib.rs includes by #[path], uses ctor and
# rustls. cargo-shear reads a source file only for the package whose src/ directory
# holds it, so it never sees the use here.
ignored = ["ctor", "rustls"]
