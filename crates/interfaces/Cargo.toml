[package]
name = "residuum-interfaces"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
residuum-core = { workspace = true }
residuum-config = { workspace = true }
residuum-bus = { workspace = true }
residuum-inference = { workspace = true }
residuum-net = { workspace = true }
residuum-workspace = { workspace = true }
residuum-checkpoints = { workspace = true }
residuum-background = { workspace = true }
aes = { workspace = true }
aes-gcm = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
ring = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
serenity = { workspace = true }
tempfile = { workspace = true }
teloxide-core = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
ts-rs = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
residuum-core = { workspace = true, features = ["test-support"] }
residuum-config = { workspace = true, features = ["test-support"] }
residuum-inference = { workspace = true, features = ["test-support"] }
residuum-net = { workspace = true, features = ["test-support"] }
residuum-bus = { workspace = true, features = ["test-support"] }
residuum-workspace = { workspace = true, features = ["test-support"] }
residuum-memory = { workspace = true, features = ["test-support"] }
residuum-background = { workspace = true, features = ["test-support"] }
residuum-checkpoints = { workspace = true, features = ["test-support"] }
ctor = { workspace = true }
jsonschema = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true }

[package.metadata.cargo-shear]
# crates/core/src/testing/crypto.rs, which lib.rs includes by #[path], uses ctor and
# rustls. cargo-shear reads a source file only for the package whose src/ directory
# holds it, so it never sees the use here.
ignored = ["ctor", "rustls"]
