[package]
name = "residuum-background"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
test-support = ["residuum-config/test-support", "dep:tempfile"]

[dependencies]
residuum-core = { workspace = true }
residuum-config = { workspace = true }
residuum-bus = { workspace = true }
residuum-inference = { workspace = true }
residuum-memory = { workspace = true }
residuum-mcp = { workspace = true }
residuum-skills = { workspace = true }
residuum-tracing-service = { workspace = true }
residuum-workspace = { workspace = true }
residuum-checkpoints = { workspace = true }
residuum-agent = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
ts-rs = { workspace = true }

[dev-dependencies]
residuum-core = { workspace = true, features = ["test-support"] }
residuum-config = { workspace = true, features = ["test-support"] }
residuum-bus = { workspace = true, features = ["test-support"] }
residuum-inference = { workspace = true, features = ["test-support"] }
residuum-memory = { workspace = true, features = ["test-support"] }
residuum-workspace = { workspace = true, features = ["test-support"] }
residuum-checkpoints = { workspace = true, features = ["test-support"] }
residuum-agent = { workspace = true, features = ["test-support"] }
ctor = { workspace = true }
rustls = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
wiremock = { workspace = true }

[package.metadata.cargo-shear]
# crates/core/src/testing/crypto.rs, which lib.rs includes by #[path], uses ctor and
# rustls. cargo-shear reads a source file only for the package whose src/ directory
# holds it, so it never sees the use here.
ignored = ["ctor", "rustls"]
