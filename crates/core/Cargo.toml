[package]
name = "residuum-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
test-support = ["tokio/test-util", "tokio/net"]

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
futures-util = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
ring = { workspace = true }
serde = { workspace = true }
serde_yaml_ng = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "net"] }

[package.metadata.cargo-shear]
# src/testing/crypto.rs is not a module of this crate: the crates and test binaries that
# build an HTTP client include it by #[path].
ignored-paths = ["src/testing/crypto.rs"]
