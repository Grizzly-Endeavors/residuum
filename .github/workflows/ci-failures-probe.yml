name: CI Failures Probe

# Throwaway: produces real failure logs for the ci-failures parser fixtures
# (issues 582 and 580). The broken web files are written by a step at run time,
# so nothing broken is committed.
on:
  pull_request:

jobs:
  probe-svelte-warning:
    name: Probe Svelte Warning
    runs-on: lab-runners-wide
    steps:
      - uses: actions/checkout@v7

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Write a file with a Svelte warning
        run: |
          cat > web/src/ProbeWarning.svelte <<'EOF'
          <img src="/probe.png" />
          <div on:click={() => {}}>probe</div>
          EOF

      - name: Web type check
        run: cd web && npm run check

  probe-service-worker-types:
    name: Probe Service Worker Types
    runs-on: lab-runners-wide
    steps:
      - uses: actions/checkout@v7

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Write a service worker file with type errors
        run: |
          cat > web/src/sw/probe.ts <<'EOF'
          export const limit: number = 'ten';
          export const name: string = limit;
          EOF

      - name: Web type check
        run: cd web && npm run check

  probe-format-syntax:
    name: Probe Format Syntax Error
    runs-on: lab-runners-wide
    steps:
      - uses: actions/checkout@v7

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Write an unparseable file and a misformatted one
        run: |
          printf 'export const a = {x:1,,};\n' > web/src/probe-syntax.ts
          printf 'export const b = {x:1,y:2};\n' > web/src/probe-format.ts

      - name: Web format check
        run: cd web && npm run format:check
