name: Rust Checks

# The Rust format, clippy (host and Windows), test, generated-types,
# dependency (audit and unused) and crate isolation checks. ci.yml calls it on
# merge queue batches that change Rust code, and on pull requests that change
# Rust code for the Windows clippy alone (`windows_clippy_only`); release.yml
# calls it on every release tag. It is also runnable by hand from the Actions
# tab, to try a change on the runners without opening a pull request.
#
# Every check is its own job so they run side by side. Each job names the
# runner pool that suits it (grizzly-platform ADR-081): the jobs that build and
# run the crate (lint and tests) compile one large crate, where per-core speed
# decides the time, so they run on lab-runners-fast; the Windows clippy checks
# without running tests, so it runs on lab-runners-wide.
on:
  workflow_call:
    inputs:
      pebble:
        description: Run the Pebble tests, which issue certificates from the Let's Encrypt test CA in Docker
        type: boolean
        default: true
      packages:
        description: The cargo package arguments for clippy and the tests, --workspace or -p residuum-<crate> pairs
        type: string
        default: --workspace
      isolation:
        description: Check each member crate alone (rust-isolation), as the merge queue does
        type: boolean
        default: true
      windows_clippy_only:
        description: Run only the Windows clippy (rust-lint-windows), as the pull request lane does; the other inputs but packages then do nothing
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      pebble:
        description: Run the Pebble tests, which issue certificates from the Let's Encrypt test CA in Docker
        type: boolean
        default: true
      packages:
        description: The cargo package arguments for clippy and the tests, --workspace or -p residuum-<crate> pairs
        type: string
        default: --workspace
      isolation:
        description: Check each member crate alone (rust-isolation)
        type: boolean
        default: true
      windows_clippy_only:
        description: Run only the Windows clippy (rust-lint-windows); the other inputs but packages then do nothing
        type: boolean
        default: false

env:
  # CI checkouts are fresh, so incremental state is never reused here, and with
  # it off sccache can cache the library build of every workspace crate. No job
  # may set CARGO_TARGET_DIR: sccache hashes its value, so a per-job target
  # directory would miss every crate.
  CARGO_INCREMENTAL: '0'

jobs:
  # Every check runs even when an earlier one fails, so one run lists every
  # failure. A check runs only when the dependencies it needs were installed,
  # and the job still fails if any step failed.
  rust-lint:
    name: Rust Lint
    if: ${{ !inputs.windows_clippy_only }}
    runs-on: lab-runners-fast

    # cargo-shear is pinned here, with its archive digests in the install step.
    # The `shear` recipe in the justfile and the pre-push hook read the version
    # from this file, so the local checks and this job cannot drift apart.
    env:
      CARGO_SHEAR_VERSION: 1.14.0

    steps:
      - uses: actions/checkout@v7

      # Install the version pinned in rust-toolchain.toml as its own toolchain;
      # the runner image's baked-in toolchain can't be updated in place.
      - name: Install pinned Rust toolchain
        id: toolchain
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" --profile minimal --component clippy,rustfmt

      # build.rs refuses to compile without web/dist, which gets embedded in the binary
      - name: Build web assets
        id: web_assets
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cd web && npm ci && npm run build

      # The checks below run whether or not an earlier one failed, so one run
      # lists every failure. Format and the dependency audit need only the
      # toolchain; clippy also needs the web build, which the Rust build embeds.
      - name: Check formatting
        id: fmt
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo fmt --all --check

      - name: Check the package selection
        id: packages
        if: ${{ !cancelled() }}
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          set -euo pipefail
          if ! grep -qE '^(--workspace|-p residuum(-[a-z]+)*( -p residuum(-[a-z]+)*)*)$' <<<"$PACKAGES"; then
            echo "::error::packages must be --workspace or -p residuum-<crate> arguments, got: $PACKAGES"
            exit 1
          fi

      - name: Clippy
        id: clippy
        if: ${{ !cancelled() && steps.web_assets.outcome == 'success' && steps.packages.outcome == 'success' }}
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          read -ra packages <<<"$PACKAGES"
          cargo clippy --all-targets --all-features "${packages[@]}" -- -D warnings

      - name: Dependency audit
        id: deny
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo deny check

      # cargo-shear reads the manifests and sources and builds nothing, so it
      # needs only the toolchain's cargo, for `cargo metadata`. The archive is
      # checked against its pinned sha256 before it is unpacked, so the run uses
      # exactly the pinned build. The release publishes no checksums file, so the
      # digests are pinned here, taken from the GitHub release asset digests;
      # change them together with CARGO_SHEAR_VERSION. The musl builds are
      # statically linked and need nothing from the runner image.
      - name: Install cargo-shear
        id: shear_install
        if: ${{ !cancelled() }}
        run: |
          case "$(uname -m)" in
            x86_64)
              target=x86_64-unknown-linux-musl
              sha=9004df4eb031a456026c4326ae0d0ce545321527a67be90f4524c1be729dc40e
              ;;
            aarch64)
              target=aarch64-unknown-linux-musl
              sha=d83f7c5b02c4c237d0454697c12df041df0bd83ffecc1aba46c6e06315fd47e1
              ;;
            *) echo "no cargo-shear build for $(uname -m)" >&2; exit 1 ;;
          esac
          work="$RUNNER_TEMP/cargo-shear"
          mkdir -p "$work/bin"
          archive="cargo-shear-${target}.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$work/$archive" "https://github.com/Boshen/cargo-shear/releases/download/v${CARGO_SHEAR_VERSION}/$archive"
          echo "$sha  $work/$archive" | sha256sum -c -
          tar -xzf "$work/$archive" -C "$work/bin" cargo-shear
          echo "$work/bin" >> "$GITHUB_PATH"

      # --locked keeps the scan from rewriting Cargo.lock, and --deny-warnings
      # fails on a warning (an unlinked file, an ignore that suppresses nothing)
      # as it does on an unused dependency.
      - name: Unused dependencies
        id: shear
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && steps.shear_install.outcome == 'success' }}
        run: cargo shear --version && cargo shear --locked --deny-warnings

      # The metrics go to the job summary and, between CI METRICS markers, to the
      # job log, which `gh run view <id> --log` and the jobs logs API can read.
      - name: Build summary
        if: always()
        run: |
          {
            echo '### Compiler cache (sccache)'
            echo ''
            echo '```'
            sccache --show-stats 2>&1 || echo 'sccache is not available on this runner'
            echo '```'
          } > "$RUNNER_TEMP/ci-metrics.md"
          {
            echo '## Rust Lint Results'
            echo ''
            echo '| Check | Status |'
            echo '|-------|--------|'
            echo "| Web assets | ${{ steps.web_assets.outcome }} |"
            echo "| Format | ${{ steps.fmt.outcome }} |"
            echo "| Clippy | ${{ steps.clippy.outcome }} |"
            echo "| Deny | ${{ steps.deny.outcome }} |"
            echo "| Shear install | ${{ steps.shear_install.outcome }} |"
            echo "| Shear | ${{ steps.shear.outcome }} |"
            echo ''
            cat "$RUNNER_TEMP/ci-metrics.md"
          } >> "$GITHUB_STEP_SUMMARY"
          echo '===== BEGIN CI METRICS (Rust Lint) ====='
          cat "$RUNNER_TEMP/ci-metrics.md"
          echo '===== END CI METRICS (Rust Lint) ====='

  # The release builds Windows from Linux with the gnu target, and code behind
  # cfg(windows) (and test imports only some platforms use) is not compiled by
  # the host clippy above. Clippy rather than check, so that code is held to
  # the same lints. The other cross targets are in cross-compile.yml.
  # Runs on the wide pool, as the cross-compile.yml clippy jobs do: it checks
  # without running tests, and a third job on the fast pool queues behind the
  # lint and test jobs of every open pull request.
  rust-lint-windows:
    name: Clippy (x86_64-pc-windows-gnu)
    runs-on: lab-runners-wide

    steps:
      - uses: actions/checkout@v7

      - name: Build web assets
        run: cd web && npm ci && npm run build

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" --profile minimal --component clippy,rustfmt

      - name: Add target
        run: rustup target add x86_64-pc-windows-gnu

      - name: Check the package selection
        id: packages
        if: ${{ !cancelled() }}
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          set -euo pipefail
          if ! grep -qE '^(--workspace|-p residuum(-[a-z]+)*( -p residuum(-[a-z]+)*)*)$' <<<"$PACKAGES"; then
            echo "::error::packages must be --workspace or -p residuum-<crate> arguments, got: $PACKAGES"
            exit 1
          fi

      - name: Clippy
        if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          read -ra packages <<<"$PACKAGES"
          cargo clippy --all-targets --all-features "${packages[@]}" --target x86_64-pc-windows-gnu -- -D warnings

  # The tests run once, on an otherwise idle runner. The suite under load (two
  # copies at once with every CPU busy) runs nightly on main
  # (nightly-stress.yml), which files each failure as an issue.
  rust-test:
    name: Rust Tests
    if: ${{ !inputs.windows_clippy_only }}
    runs-on: lab-runners-fast

    steps:
      - uses: actions/checkout@v7

      # The node's CPU pressure is counted from here (scripts/ci-cpu-report.sh).
      - name: Start the CPU report
        run: scripts/ci-cpu-report.sh start

      - name: Install pinned Rust toolchain
        id: toolchain
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" --profile minimal --component clippy,rustfmt

      - name: Build web assets
        id: web_assets
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cd web && npm ci && npm run build

      - name: Check the package selection
        id: packages
        if: ${{ !cancelled() }}
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          set -euo pipefail
          if ! grep -qE '^(--workspace|-p residuum(-[a-z]+)*( -p residuum(-[a-z]+)*)*)$' <<<"$PACKAGES"; then
            echo "::error::packages must be --workspace or -p residuum-<crate> arguments, got: $PACKAGES"
            exit 1
          fi

      # Compiles every test binary before any test runs. The test steps depend on
      # this build, not on each other, so a compile error is reported here once.
      - name: Build test binaries
        id: build_tests
        if: ${{ !cancelled() && steps.web_assets.outcome == 'success' && steps.packages.outcome == 'success' }}
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          read -ra packages <<<"$PACKAGES"
          cargo test --quiet --no-run "${packages[@]}"

      # --no-fail-fast runs every test binary, so one run lists every failing test.
      - name: Tests
        id: test
        if: ${{ !cancelled() && steps.build_tests.outcome == 'success' }}
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          read -ra packages <<<"$PACKAGES"
          cargo test --quiet --no-fail-fast "${packages[@]}"

      # Remote access issuance against Pebble, the Let's Encrypt test CA, in
      # Docker (see docs/systems-usage/secure-tunnel.md, "Tests"). The
      # containers run on the Docker daemon beside the runner, which shares
      # the runner's network. They run one at a time: every container uses
      # host networking on ports picked as free just before it starts, so
      # parallel tests can take each other's ports.
      - name: Pebble tests
        id: pebble
        if: ${{ !cancelled() && inputs.pebble && steps.build_tests.outcome == 'success' }}
        run: cargo test --quiet -p residuum-net --lib -- --ignored --test-threads=1 pebble system_tests

      # Regenerates web/src/lib/generated from the Rust protocol types and
      # fails on any difference from what is committed.
      - name: Generated types are up to date
        id: types
        if: ${{ !cancelled() && steps.web_assets.outcome == 'success' }}
        run: scripts/check-generated-types.sh

      # The metrics go to the job summary and, between CI METRICS markers, to the
      # job log, which `gh run view <id> --log` and the jobs logs API can read.
      - name: Build summary
        if: always()
        run: |
          {
            echo '### Compiler cache (sccache)'
            echo ''
            echo '```'
            sccache --show-stats 2>&1 || echo 'sccache is not available on this runner'
            echo '```'
            echo ''
            scripts/ci-cpu-report.sh report
          } > "$RUNNER_TEMP/ci-metrics.md"
          {
            echo '## Rust Test Results'
            echo ''
            echo '| Check | Status |'
            echo '|-------|--------|'
            echo "| Web assets | ${{ steps.web_assets.outcome }} |"
            echo "| Test binaries | ${{ steps.build_tests.outcome }} |"
            echo "| Tests | ${{ steps.test.outcome }} |"
            echo "| Pebble tests | ${{ steps.pebble.outcome }} |"
            echo "| Generated types | ${{ steps.types.outcome }} |"
            echo ''
            cat "$RUNNER_TEMP/ci-metrics.md"
          } >> "$GITHUB_STEP_SUMMARY"
          echo '===== BEGIN CI METRICS (Rust Tests) ====='
          cat "$RUNNER_TEMP/ci-metrics.md"
          echo '===== END CI METRICS (Rust Tests) ====='

  # Cargo unifies features across every package in one build, so a member can
  # compile in a whole-workspace run only because another package turns on a
  # feature it needs. Each member is checked alone, in its own cargo
  # invocations, so nothing unifies across members. Runs only when `isolation`
  # is set (the merge queue and releases).
  rust-isolation:
    name: Crate Isolation
    if: inputs.isolation && !inputs.windows_clippy_only
    runs-on: lab-runners-wide

    steps:
      - uses: actions/checkout@v7

      # build.rs refuses to compile without web/dist; the root library check builds it
      - name: Build web assets
        run: cd web && npm ci && npm run build

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" --profile minimal --component clippy,rustfmt

      - name: Check the root library and each member crate alone
        run: scripts/check-crate-isolation.sh
