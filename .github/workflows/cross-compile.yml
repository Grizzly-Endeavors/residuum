name: Cross-Platform Checks

# Opt-in: runs on a PR carrying the `cross-compile` label, on a PR that changes
# dependencies or the toolchain, or by hand with
# `gh workflow run cross-compile.yml --ref <branch>`.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# Adding an unrelated label gets its own group, so it can't cancel a real run
concurrency:
  group: cross-compile-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'cross-compile' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  gate:
    name: Decide whether to cross-compile
    runs-on: lab-runners

    outputs:
      run: ${{ steps.decide.outputs.run }}

    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ADDED_LABEL: ${{ github.event.label.name }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'cross-compile') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          run=false
          reason="no cross-compile label and no dependency or toolchain change"
          if [ "$EVENT" = workflow_dispatch ]; then
            run=true; reason="manual dispatch"
          elif [ "$ACTION" = labeled ]; then
            if [ "$ADDED_LABEL" = cross-compile ]; then
              run=true; reason="cross-compile label added"
            else
              reason="unrelated label added"
            fi
          elif [ "$HAS_LABEL" = true ]; then
            run=true; reason="PR has the cross-compile label"
          elif git diff --name-only "$BASE_SHA...$HEAD_SHA" -- Cargo.toml Cargo.lock build.rs rust-toolchain.toml | grep -q .; then
            run=true; reason="dependency or toolchain change"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Cross-compile: $run ($reason)" | tee -a "$GITHUB_STEP_SUMMARY"

  cross-check:
    name: Clippy (${{ matrix.target }})
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: lab-runners

    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - x86_64-pc-windows-gnu

    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

    steps:
      - uses: actions/checkout@v7

      - name: Build web assets
        run: cd web && npm ci && npm run build

      # Install the version pinned in rust-toolchain.toml as its own toolchain;
      # the runner image's baked-in toolchain can't be updated in place.
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" --profile minimal --component clippy,rustfmt

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      # Clippy rather than check, so code behind a cfg for another platform is
      # held to the same lints as the host build
      - name: Clippy
        run: cargo clippy --all-targets --all-features --target ${{ matrix.target }} -- -D warnings

  macos-check:
    name: Clippy (aarch64-apple-darwin)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7

      - name: Install rustup
        uses: dtolnay/rust-toolchain@stable

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" --profile minimal --component clippy,rustfmt

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cache cargo registry and target dir
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-aarch64-apple-darwin-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            macos-aarch64-apple-darwin-cargo-

      - name: Build web assets
        run: cd web && npm ci && npm run build

      - name: Clippy
        run: cargo clippy --all-targets --all-features --target aarch64-apple-darwin -- -D warnings

  # Runs the test suite on real Windows, where cfg(windows) code actually
  # executes: file permissions, PID locking, process spawning, and re-exec.
  windows-tests:
    name: Tests (Windows)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Install rustup
        uses: dtolnay/rust-toolchain@stable

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" --profile minimal --component clippy,rustfmt

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cache cargo registry and target dir
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-x86_64-msvc-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            windows-x86_64-msvc-cargo-

      - name: Build web assets
        run: cd web && npm ci && npm run build

      - name: Test
        run: cargo test --quiet --all-features
