name: Quality Checks

# Also runnable by hand from the Actions tab, to try a change on the runners
# without cutting a release.
#
# Every check is its own job so they run side by side. Each job names the
# runner pool that suits it (grizzly-platform ADR-081): Rust jobs compile one
# large crate, where per-core speed decides the time, so they run on
# lab-runners-fast; the web jobs split well across runners, so they run on
# lab-runners-wide.
on:
  workflow_call:
    inputs:
      web:
        description: Run the web format, lint, type, test, build, and end-to-end checks
        type: boolean
        default: true
      rust:
        description: Run the Rust format, clippy, test, and dependency checks
        type: boolean
        default: true
      visual:
        description: Run the web visual comparisons, which compare component screenshots against the committed baselines in their own job and never fail the workflow; turn off to leave them out
        type: boolean
        default: true
    outputs:
      visual_status:
        description: How the visual comparisons ended; match, differ, error or skipped, and empty when the job did not run or did not finish
        value: ${{ jobs.web-visual.outputs.status }}
      visual_body:
        description: The Markdown of the pull request comment that reports the visual comparisons, with the marker that finds the comment again
        value: ${{ jobs.web-visual.outputs.body }}
  workflow_dispatch:
    inputs:
      web:
        description: Run the web format, lint, type, test, build, and end-to-end checks
        type: boolean
        default: true
      rust:
        description: Run the Rust format, clippy, test, and dependency checks
        type: boolean
        default: true
      visual:
        description: Run the web visual comparisons, which compare component screenshots against the committed baselines in their own job and never fail the workflow; turn off to leave them out
        type: boolean
        default: true

jobs:
  web:
    name: Web Checks
    if: inputs.web
    runs-on: lab-runners-wide

    steps:
      - uses: actions/checkout@v7

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Web format check
        id: web_format
        run: cd web && npm run format:check

      - name: Web lint
        id: web_lint
        run: cd web && npm run lint

      - name: Web type check
        id: web_typecheck
        run: cd web && npm run check

      # The same tests as `npm test`, with a coverage report. Reported in the
      # job summary below, with no threshold.
      - name: Web unit tests
        id: web_test
        run: cd web && npm run test:coverage

      - name: Build web assets
        id: web_build
        run: cd web && npm run build

      - name: Build summary
        if: always()
        run: |
          {
            echo '## Web Check Results'
            echo ''
            echo '| Check | Status |'
            echo '|-------|--------|'
            echo "| Format | ${{ steps.web_format.outcome }} |"
            echo "| Lint | ${{ steps.web_lint.outcome }} |"
            echo "| Types | ${{ steps.web_typecheck.outcome }} |"
            echo "| Tests | ${{ steps.web_test.outcome }} |"
            echo "| Build | ${{ steps.web_build.outcome }} |"
            echo ''
            echo 'The end-to-end and accessibility results are in the Web End-to-End jobs, and the visual comparisons in the Web Visual Comparisons job.'
            if [ -f web/coverage/summary.txt ]; then
              echo ''
              echo '### Web test coverage'
              echo ''
              echo '```'
              sed '/^$/d' web/coverage/summary.txt
              echo '```'
            fi
            if [ -f web/dist/index.html ]; then
              echo ''
              echo '### Web initial-route size'
              echo ''
              scripts/web-initial-route-size.sh web/dist 2>&1 || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The end-to-end and accessibility specs drive a browser against the mock
  # (web/CONTRIBUTING.md, "Testing"), split into shards that run on separate
  # runners. Playwright gives each shard a share of the individual tests.
  # The runner installs no browser: the download from cdn.playwright.dev
  # stalls on the cluster's missing IPv6 route. Instead every project drives
  # the browser in the official Playwright container, which the Docker daemon
  # beside the runner starts and the wrapper script stops. The image comes
  # through the cluster registry's mirror of mcr.microsoft.com, so it is
  # pulled over the LAN. E2E_ALL_IN_CONTAINER sends the Chromium projects
  # there. CI is set on the runner, so the untagged specs run against the
  # production build (web/playwright.config.ts, `smokeServer`). The visual
  # comparisons are not part of these shards; they run in `web-visual` below.
  web-e2e:
    name: Web End-to-End (${{ matrix.shard }}/4)
    if: inputs.web
    runs-on: lab-runners-wide

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    env:
      E2E_ALL_IN_CONTAINER: '1'
      E2E_WORKERS: '4'
      PLAYWRIGHT_IMAGE_REGISTRY: registry.registry.svc.cluster.local:5000/mcr

    steps:
      - uses: actions/checkout@v7

      # The node's CPU pressure is counted from here (scripts/ci-cpu-report.sh).
      - name: Start the CPU report
        run: scripts/ci-cpu-report.sh start

      # Playwright builds the app itself for the preview projects
      # (web/playwright.config.ts, `webServer`).
      - name: Install web dependencies
        run: cd web && npm ci

      - name: Web end-to-end tests
        id: web_e2e
        run: scripts/with-playwright-container.sh npm --prefix web run e2e:fast -- --shard=${{ matrix.shard }}/4

      # How much CPU the shard had, whether its limit throttled it, and how
      # long the node kept it waiting: the suite's timing depends on all three.
      - name: CPU report
        if: always()
        run: scripts/ci-cpu-report.sh report | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report and traces
        if: always() && steps.web_e2e.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14

      - name: Build summary
        if: always()
        run: |
          {
            echo '## Web End-to-End Results (shard ${{ matrix.shard }} of 4)'
            echo ''
            echo '| Check | Status |'
            echo '|-------|--------|'
            echo "| End-to-end and accessibility | ${{ steps.web_e2e.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # The visual comparisons are a design reference for a human to look at
  # (web/CONTRIBUTING.md, "Visual"): they never fail the workflow, a pull
  # request's checks or a release. One job runs all of them, in the Playwright
  # container like the shards above, with Playwright's JSON report beside the
  # HTML one. web/scripts/visual-report.mjs sorts each shot into matches, differs,
  # new (no baseline) or errored, and writes the Markdown that the pull request
  # workflow posts as its one comment (web-pr.yml, `visual-report`). The report
  # and the expected, actual and diff images are uploaded whenever a shot is
  # not a match. Every step after the comparisons runs even when they fail, so
  # the outputs are set whatever happened.
  web-visual:
    name: Web Visual Comparisons
    if: inputs.web && inputs.visual
    runs-on: lab-runners-wide
    continue-on-error: true

    outputs:
      status: ${{ steps.classify.outputs.status }}
      body: ${{ steps.render.outputs.body }}

    env:
      E2E_ALL_IN_CONTAINER: '1'
      E2E_WORKERS: '4'
      PLAYWRIGHT_IMAGE_REGISTRY: registry.registry.svc.cluster.local:5000/mcr
      PLAYWRIGHT_HTML_OPEN: never

    steps:
      - uses: actions/checkout@v7

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Web visual comparisons
        id: web_visual
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/visual-results.json
        run: scripts/with-playwright-container.sh npm --prefix web run e2e:visual -- --reporter=list,html,json

      - name: Sort the shots
        id: classify
        if: always()
        run: node web/scripts/visual-report.mjs classify "$RUNNER_TEMP/visual-results.json" "$RUNNER_TEMP/visual-classification.json"

      - name: Upload Playwright report and images
        id: upload
        if: always() && steps.classify.outputs.status != 'match'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-visual-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Write the report
        id: render
        if: always() && steps.classify.outcome == 'success'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node web/scripts/visual-report.mjs render "$RUNNER_TEMP/visual-classification.json" "$RUNNER_TEMP/visual-report.md"

  rust-lint:
    name: Rust Lint
    if: inputs.rust
    runs-on: lab-runners-fast

    steps:
      - uses: actions/checkout@v7

      # Install the version pinned in rust-toolchain.toml as its own toolchain;
      # the runner image's baked-in toolchain can't be updated in place.
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" --profile minimal --component clippy,rustfmt

      # build.rs refuses to compile without web/dist, which gets embedded in the binary
      - name: Build web assets
        run: cd web && npm ci && npm run build

      - name: Check formatting
        id: fmt
        run: cargo fmt --all --check

      - name: Clippy
        id: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Dependency audit
        id: deny
        if: always() && steps.fmt.outcome != 'skipped'
        run: cargo deny check

      - name: Build summary
        if: always()
        run: |
          {
            echo '## Rust Lint Results'
            echo ''
            echo '| Check | Status |'
            echo '|-------|--------|'
            echo "| Format | ${{ steps.fmt.outcome }} |"
            echo "| Clippy | ${{ steps.clippy.outcome }} |"
            echo "| Deny | ${{ steps.deny.outcome }} |"
            echo ''
            echo '### Compiler cache (sccache)'
            echo ''
            echo '```'
            sccache --show-stats 2>&1 || echo 'sccache is not available on this runner'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  rust-test:
    name: Rust Tests
    if: inputs.rust
    runs-on: lab-runners-fast

    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" --profile minimal --component clippy,rustfmt

      - name: Build web assets
        run: cd web && npm ci && npm run build

      - name: Tests
        id: test
        run: cargo test --quiet

      # The suite again, as two concurrent copies with every CPU busy: how it
      # runs when several agents share a machine. Reuses the binaries the Tests
      # step built. A failure here is a test waiting on time instead of the
      # event it checks; fix the wait (CONTRIBUTING.md, "Waiting in tests"),
      # never rerun past it.
      - name: Stress
        id: stress
        if: steps.test.outcome == 'success'
        run: scripts/stress-tests.sh

      # Remote access issuance against Pebble, the Let's Encrypt test CA, in
      # Docker (see docs/systems-usage/secure-tunnel.md, "Tests"). The
      # containers run on the Docker daemon beside the runner, which shares
      # the runner's network. They run one at a time: every container uses
      # host networking on ports picked as free just before it starts, so
      # parallel tests can take each other's ports.
      - name: Pebble tests
        id: pebble
        if: always() && steps.test.outcome != 'skipped'
        run: cargo test --quiet --lib -- --ignored --test-threads=1 pebble system_tests

      # Regenerates web/src/lib/generated from the Rust protocol types and
      # fails on any difference from what is committed.
      - name: Generated types are up to date
        id: types
        if: always() && steps.test.outcome != 'skipped'
        run: scripts/check-generated-types.sh

      - name: Build summary
        if: always()
        run: |
          {
            echo '## Rust Test Results'
            echo ''
            echo '| Check | Status |'
            echo '|-------|--------|'
            echo "| Tests | ${{ steps.test.outcome }} |"
            echo "| Stress (2 copies under load) | ${{ steps.stress.outcome }} |"
            echo "| Pebble tests | ${{ steps.pebble.outcome }} |"
            echo "| Generated types | ${{ steps.types.outcome }} |"
            echo ''
            if [ -s target/stress/summary.txt ]; then
              echo '### Stress failures (count, test)'
              echo ''
              echo '```'
              cat target/stress/summary.txt
              echo '```'
              echo ''
            fi
            echo '### Compiler cache (sccache)'
            echo ''
            echo '```'
            sccache --show-stats 2>&1 || echo 'sccache is not available on this runner'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
