name: Quality Checks

# Also runnable by hand from the Actions tab, to try a change on the runners
# without cutting a release.
on:
  workflow_call:
    inputs:
      web:
        description: Run the web format, lint, type, test, build, and end-to-end checks
        type: boolean
        default: true
      rust:
        description: Run the Rust format, clippy, test, and dependency checks
        type: boolean
        default: true
      visual:
        description: Run the web visual comparisons, which compare screenshots against the committed baselines; turn off to run the other end-to-end specs only
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      web:
        description: Run the web format, lint, type, test, build, and end-to-end checks
        type: boolean
        default: true
      rust:
        description: Run the Rust format, clippy, test, and dependency checks
        type: boolean
        default: true
      visual:
        description: Run the web visual comparisons, which compare screenshots against the committed baselines; turn off to run the other end-to-end specs only
        type: boolean
        default: true

jobs:
  web:
    name: Web Checks
    if: inputs.web
    runs-on: lab-runners

    steps:
      - uses: actions/checkout@v7

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Web format check
        id: web_format
        run: cd web && npm run format:check

      - name: Web lint
        id: web_lint
        run: cd web && npm run lint

      - name: Web type check
        id: web_typecheck
        run: cd web && npm run check

      # The same tests as `npm test`, with a coverage report. Reported in the
      # job summary below, with no threshold.
      - name: Web unit tests
        id: web_test
        run: cd web && npm run test:coverage

      - name: Build web assets
        id: web_build
        run: cd web && npm run build

      # The end-to-end and accessibility specs drive a browser against the mock
      # (web/CONTRIBUTING.md, "Testing"). The runner installs no browser: the
      # download from cdn.playwright.dev stalls on the cluster's missing IPv6
      # route. Instead every project drives the browser in the official
      # Playwright container, which the Docker daemon beside the runner starts
      # and the wrapper script stops. E2E_ALL_IN_CONTAINER sends the Chromium
      # projects there, as the visual ones always go. The visual comparisons
      # run unless the `visual` input is turned off, and then the summary says
      # so.
      - name: Web end-to-end tests
        id: web_e2e
        if: ${{ !inputs.visual }}
        env:
          E2E_ALL_IN_CONTAINER: '1'
        run: scripts/with-playwright-container.sh npm --prefix web run e2e:fast

      - name: Web end-to-end and visual tests
        id: web_e2e_visual
        if: ${{ inputs.visual }}
        env:
          E2E_ALL_IN_CONTAINER: '1'
        run: scripts/with-playwright-container.sh npm --prefix web run e2e

      # Fails when the gzipped initial route outgrows its budget, which is set
      # in the script. It runs after a successful build even when the end-to-end
      # specs failed, so a size regression shows up beside a test failure.
      - name: Web initial-route budget
        id: web_size
        if: always() && steps.web_build.outcome == 'success'
        run: scripts/web-initial-route-size.sh web/dist

      - name: Upload Playwright report and traces
        if: always() && (steps.web_e2e.outcome == 'failure' || steps.web_e2e_visual.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14

      - name: Build summary
        if: always()
        run: |
          {
            echo '## Web Check Results'
            echo ''
            echo '| Check | Status |'
            echo '|-------|--------|'
            echo "| Format | ${{ steps.web_format.outcome }} |"
            echo "| Lint | ${{ steps.web_lint.outcome }} |"
            echo "| Types | ${{ steps.web_typecheck.outcome }} |"
            echo "| Tests | ${{ steps.web_test.outcome }} |"
            echo "| Build | ${{ steps.web_build.outcome }} |"
            echo "| End-to-end and accessibility | ${{ inputs.visual && steps.web_e2e_visual.outcome || steps.web_e2e.outcome }} |"
            if [ "${{ inputs.visual }}" = "true" ]; then
              echo "| Visual comparisons | ${{ steps.web_e2e_visual.outcome }} |"
            else
              echo '| Visual comparisons | skipped: the `visual` input is off |'
            fi
            echo "| Initial-route budget | ${{ steps.web_size.outcome }} |"
            if [ -f web/coverage/summary.txt ]; then
              echo ''
              echo '### Web test coverage'
              echo ''
              echo '```'
              sed '/^$/d' web/coverage/summary.txt
              echo '```'
            fi
            # The table, and the over-budget message when there is one. The budget step decides the outcome.
            if [ -f web/dist/index.html ]; then
              echo ''
              echo '### Web initial-route size'
              echo ''
              scripts/web-initial-route-size.sh web/dist 2>&1 || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  rust:
    name: Rust Checks
    if: inputs.rust
    runs-on: lab-runners

    steps:
      - uses: actions/checkout@v7

      # Install the version pinned in rust-toolchain.toml as its own toolchain;
      # the runner image's baked-in toolchain can't be updated in place.
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" --profile minimal --component clippy,rustfmt

      # build.rs refuses to compile without web/dist, which gets embedded in the binary
      - name: Build web assets
        run: cd web && npm ci && npm run build

      - name: Check formatting
        id: fmt
        run: cargo fmt --all --check

      - name: Clippy
        id: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        id: test
        run: cargo test --quiet

      # Regenerates web/src/lib/generated from the Rust protocol types and
      # fails on any difference from what is committed.
      - name: Generated types are up to date
        id: types
        run: scripts/check-generated-types.sh

      - name: Dependency audit
        id: deny
        run: cargo deny check

      - name: Build summary
        if: always()
        run: |
          {
            echo '## Rust Check Results'
            echo ''
            echo '| Check | Status |'
            echo '|-------|--------|'
            echo "| Format | ${{ steps.fmt.outcome }} |"
            echo "| Clippy | ${{ steps.clippy.outcome }} |"
            echo "| Tests | ${{ steps.test.outcome }} |"
            echo "| Generated types | ${{ steps.types.outcome }} |"
            echo "| Deny | ${{ steps.deny.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
