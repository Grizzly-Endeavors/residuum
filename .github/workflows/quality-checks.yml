name: Quality Checks

on:
  workflow_call:
    inputs:
      web:
        description: Run the web format, lint, type, and build checks
        type: boolean
        default: true
      rust:
        description: Run the Rust format, clippy, test, and dependency checks
        type: boolean
        default: true

jobs:
  web:
    name: Web Checks
    if: inputs.web
    runs-on: lab-runners

    steps:
      - uses: actions/checkout@v4

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Web format check
        id: web_format
        run: cd web && npm run format:check

      - name: Web lint
        id: web_lint
        run: cd web && npm run lint

      - name: Web type check
        id: web_typecheck
        run: cd web && npm run check

      - name: Build web assets
        id: web_build
        run: cd web && npm run build

      - name: Build summary
        if: always()
        run: |
          {
            echo '## Web Check Results'
            echo ''
            echo '| Check | Status |'
            echo '|-------|--------|'
            echo "| Format | ${{ steps.web_format.outcome }} |"
            echo "| Lint | ${{ steps.web_lint.outcome }} |"
            echo "| Types | ${{ steps.web_typecheck.outcome }} |"
            echo "| Build | ${{ steps.web_build.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  rust:
    name: Rust Checks
    if: inputs.rust
    runs-on: lab-runners

    steps:
      - uses: actions/checkout@v4

      # build.rs refuses to compile without web/dist, which gets embedded in the binary
      - name: Build web assets
        run: cd web && npm ci && npm run build

      - name: Check formatting
        id: fmt
        run: cargo fmt --all --check

      - name: Clippy
        id: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        id: test
        run: cargo test --quiet

      - name: Dependency audit
        id: deny
        run: cargo deny check

      - name: Build summary
        if: always()
        run: |
          {
            echo '## Rust Check Results'
            echo ''
            echo '| Check | Status |'
            echo '|-------|--------|'
            echo "| Format | ${{ steps.fmt.outcome }} |"
            echo "| Clippy | ${{ steps.clippy.outcome }} |"
            echo "| Tests | ${{ steps.test.outcome }} |"
            echo "| Deny | ${{ steps.deny.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
