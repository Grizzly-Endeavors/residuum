name: Pull Request Checks

on:
  pull_request:

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: lab-runners

    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      web: ${{ steps.classify.outputs.web }}
      platform: ${{ steps.classify.outputs.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Paths not listed below trigger every check, so a new directory is never
      # skipped by accident; it has to be classified here first.
      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          rust=false
          web=false
          platform=false
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              .github/*)
                rust=true; web=true; platform=true ;;
              bindings/*)
                rust=true; web=true ;;
              web/*)
                web=true ;;
              Cargo.toml|Cargo.lock|build.rs|rust-toolchain.toml)
                rust=true; platform=true ;;
              src/*|tests/*|assets/*|clippy.toml|deny.toml|rustfmt.toml)
                rust=true ;;
              docs/*|*.md|mac/*|bundle/*|docker/*|scripts/*|.githooks/*|audit-results/*|reference-mats/*|LICENSE|.gitignore)
                ;;
              *)
                echo "::notice::unclassified path $path, running all checks"
                rust=true; web=true; platform=true ;;
            esac
          done <<< "$changed"
          {
            echo "rust=$rust"
            echo "web=$web"
            echo "platform=$platform"
          } >> "$GITHUB_OUTPUT"
          {
            echo '## Changed Areas'
            echo ''
            echo "| Area | Checks run |"
            echo "|------|------------|"
            echo "| Rust | $rust |"
            echo "| Web | $web |"
            echo "| Cross-compile | $platform |"
          } >> "$GITHUB_STEP_SUMMARY"

  quality:
    name: Quality Checks
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/quality-checks.yml
    with:
      rust: ${{ needs.changes.outputs.rust == 'true' }}
      web: ${{ needs.changes.outputs.web == 'true' }}

  cross-compile:
    name: Cross-compile
    needs: [changes, quality]
    if: needs.changes.outputs.platform == 'true'
    uses: ./.github/workflows/cross-compile.yml

  # Single status to require on main: passes when every check that needed to run passed
  ci-ok:
    name: CI OK
    needs: [changes, quality, cross-compile]
    if: always()
    runs-on: lab-runners

    steps:
      - name: Verify check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::a required check finished as $result"; exit 1 ;;
            esac
          done
