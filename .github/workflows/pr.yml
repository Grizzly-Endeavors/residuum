name: Pull Request Checks

on:
  pull_request:

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: lab-runners

    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      web: ${{ steps.classify.outputs.web }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Paths not listed below trigger every check, so a new directory is never
      # skipped by accident; it has to be classified here first.
      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          rust=false
          web=false
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              .github/*|bindings/*)
                rust=true; web=true ;;
              web/*)
                web=true ;;
              src/*|tests/*|assets/*|Cargo.toml|Cargo.lock|build.rs|clippy.toml|deny.toml|rustfmt.toml|rust-toolchain.toml)
                rust=true ;;
              docs/*|*.md|mac/*|bundle/*|docker/*|scripts/*|.githooks/*|audit-results/*|reference-mats/*|LICENSE|.gitignore)
                ;;
              *)
                echo "::notice::unclassified path $path, running all checks"
                rust=true; web=true ;;
            esac
          done <<< "$changed"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          {
            echo '## Changed Areas'
            echo ''
            echo "| Area | Checks run |"
            echo "|------|------------|"
            echo "| Rust | $rust |"
            echo "| Web | $web |"
          } >> "$GITHUB_STEP_SUMMARY"

  quality:
    name: Quality Checks
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/quality-checks.yml
    with:
      rust: ${{ needs.changes.outputs.rust == 'true' }}
      web: ${{ needs.changes.outputs.web == 'true' }}

  cross-check:
    name: Compile check (${{ matrix.target }})
    needs: [changes, quality]
    if: needs.changes.outputs.rust == 'true'
    runs-on: lab-runners

    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - x86_64-pc-windows-gnu

    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

    steps:
      - uses: actions/checkout@v4

      - name: Build web assets
        run: cd web && npm ci && npm run build

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Compile check
        run: cargo check --all-targets --all-features --target ${{ matrix.target }}

  macos-check:
    name: Compile check (aarch64-apple-darwin)
    needs: [changes, quality]
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cache cargo registry and target dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-aarch64-apple-darwin-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            macos-aarch64-apple-darwin-cargo-

      - name: Build web assets
        run: cd web && npm ci && npm run build

      - name: Compile check
        run: cargo check --all-targets --all-features --target aarch64-apple-darwin

  # Single status to require on main: passes when every check that needed to run passed
  ci-ok:
    name: CI OK
    needs: [changes, quality, cross-check, macos-check]
    if: always()
    runs-on: lab-runners

    steps:
      - name: Verify check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::a required check finished as $result"; exit 1 ;;
            esac
          done
