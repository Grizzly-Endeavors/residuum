# HEARTBEAT.yml — Pulse monitoring configuration
#
# Define ambient checks the agent performs on a schedule.
# Results are filed to the inbox. End a summary with HEARTBEAT_URGENT to also
# push it to every configured notification channel.
#
# Fields:
#   schedule: duration string — "30m", "2h", "24h"
#   active_hours: optional — "HH:MM-HH:MM" in configured timezone
#                 supports overnight windows (e.g. "22:00-06:00")
#   agent: ~ (plain session, no skill) | "skill-name" (session with that
#          skill activated as its role). "main" is no longer accepted — every
#          session fork already carries the main agent's identity and a
#          memory snapshot.
#   model_tier: optional — "small" (default) | "medium" | "large"

# ── Built-in pulses ─────────────────────────────────────────────
# On by default. Comment out to disable; edit freely to tune.
pulses:
  - name: reflection
    enabled: true
    schedule: "7d"
    agent: "introspection"
    model_tier: "large"
    tasks:
      - name: find_patterns
        prompt: "Review the past few weeks of episodes and observations with memory_search and memory_get. Look for: tasks the user does repeatedly by hand, topics they keep returning to, requests mentioned but never finished, and friction they keep hitting. Keep only the few strongest findings."
      - name: deliver_suggestions
        prompt: "For each finding, write a concrete offer: what you noticed (with evidence) and what you could do about it — include ready-to-paste HEARTBEAT.yml pulse definitions where a scheduled check would help. Deliver everything in one user_inbox_add call."

  - name: memory_tending
    enabled: true
    schedule: "24h"
    active_hours: "02:00-06:00"
    agent: "wiki"
    model_tier: "large"
    tasks:
      - name: gate
        prompt: "Find the last ingest entry in wiki/log.md and the episode it went through, then try memory_get on the next episode ID. If that episode is not found, respond with exactly HEARTBEAT_OK and skip the remaining tasks."
      - name: ingest
        prompt: "Run the Ingest procedure from your instructions: file the new knowledge into wiki pages and USER.md, then update the indexes and log. Summarize what you filed, one line per page touched."

  - name: wiki_lint
    enabled: true
    schedule: "7d"
    active_hours: "02:00-06:00"
    agent: "wiki"
    model_tier: "large"
    tasks:
      - name: lint
        prompt: "Run the Lint procedure from your instructions across the whole wiki, fixing each problem as you find it. Summarize what you fixed, one line per fix."

